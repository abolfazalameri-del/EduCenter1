    if(invoiceId && list.some(function(i){return i.id===invoiceId;})) is.value=invoiceId;
    suggest();
  }
  function suggest(){ var inv=is.value?byId(DB.studentFees,is.value):null; if(!inv) return; var next=invoiceInfo(inv).schedule.filter(function(x){return x.remaining>0;})[0]; if(next && !am.value) am.value=next.remaining; }
  ss.addEventListener('change',function(){ am.value=''; fillInv(); }); is.addEventListener('change',function(){ am.value=''; suggest(); });
  fillInv();
}

PAGES.fees = function(main){
  var yid = currentYearId();
  main.innerHTML = '<div class="page-head"><h1>فیس و امور مالی شاگردان</h1><div class="actions"><button class="btn btn-outline" id="fp-debtors">بدهکاران</button><button class="btn btn-outline" id="fs-struct">ساختار فیس صنوف</button><button class="btn btn-outline" id="fp-invoice" data-page-add>صدور فیس‌نامه</button><button class="btn btn-primary" id="fp-add" data-page-add><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+SVG_ADD+'</svg> ثبت پرداخت فیس</button></div></div>'+
    '<div class="card card-pad"><div id="fp-table"></div></div>';
  draw();
  main.querySelector('#fp-add').onclick=function(){ openForm(); };
  main.querySelector('#fp-invoice').onclick=function(){ openInvoiceForm(null,draw); };
  main.querySelector('#fp-debtors').onclick=function(){ openDebtors(); };
  main.querySelector('#fs-struct').onclick=function(){ openStructures(); };
  function rows(){
    return activeStudents().filter(function(s){return s.academicYearId===yid;}).map(function(s){
      var b = studentBalance(s.id);
      return {id:s.id, name:s.name, classId:s.classId, total:b.total, paid:b.paid, remaining:b.remaining, overdue:b.overdue, status: b.remaining<=0? (b.total>0?'پرداخت‌شده':'—') : (b.overdue>0?'سررسید گذشته':(b.paid>0?'دارای باقی‌مانده':'بدهکار'))};
    });
  }
  function draw(){
    renderDataTable(main.querySelector('#fp-table'),{
      data: rows(), searchKeys:['id','name'],
      filters:[{key:'status',label:'وضعیت',options:['پرداخت‌شده','دارای باقی‌مانده','بدهکار','سررسید گذشته']}],
      onPrint:function(list){ printTable('گزارش فیس شاگردان',['شماره','نام','صنف','مجموع','پرداخت‌شده','باقی‌مانده'], list.map(function(r){return [r.id,r.name,classLabel(r.classId),fmtMoney(r.total),fmtMoney(r.paid),fmtMoney(r.remaining)];})); },
      columns:[{key:'id',label:'شماره'},{key:'name',label:'نام'},{key:'classId',label:'صنف',render:function(r){return classLabel(r.classId);}},
        {key:'total',label:'مجموع فیس',render:function(r){return fmtMoney(r.total);}},{key:'paid',label:'پرداخت‌شده',render:function(r){return fmtMoney(r.paid);}},
        {key:'remaining',label:'باقی‌مانده',render:function(r){return fmtMoney(r.remaining);}},{key:'overdue',label:'سررسید گذشته',render:function(r){return r.overdue?fmtMoney(r.overdue):'—';}},{key:'status',label:'وضعیت',render:function(r){return statusBadge(r.status);}}],
      actions:function(r){ return iconBtn(SVG_VIEW,'مشاهده','view',r.id)+iconBtn('<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/>','ثبت پرداخت','pay',r.id); }
    });
    var tbl = main.querySelector('#fp-table');
    bindOnce(tbl, 'click', function(e){
      var b=e.target.closest('[data-act]'); if(!b) return;
      var id=b.getAttribute('data-id'), act=b.getAttribute('data-act');
      if(act==='view') navTo('#/students/detail/'+id);
      else if(act==='pay') openForm(id);
    });
  }
  function openForm(studentId){ openFeePaymentForm(studentId,null,draw); }
  function openDebtors(){
    var list = activeStudents().map(function(st){ var b=studentBalance(st.id); return {id:st.id,name:st.name,classId:st.classId,phone:st.phone||'',total:b.total,paid:b.paid,remaining:b.remaining,overdue:b.overdue,oldestDue:b.oldestDue,courses:activeCourseNames(st.id).join('، ')}; }).filter(function(r){return r.remaining>0;}).sort(function(a,b){ return (b.overdue-a.overdue) || (b.remaining-a.remaining); });
    var box = openModal('<div class="modal-head"><h3>گزارش بدهکاران — '+esc(activeBranchLabel())+'</h3><button class="icon-btn" id="db-x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="modal-body"><div id="db-sum" style="margin-bottom:8px;font-size:13px;"></div><div id="db-table"></div></div>',{size:'lg'});
    box.querySelector('#db-x').onclick=function(){ closeModal(box); };
    var totalRem=list.reduce(function(t,r){return t+r.remaining;},0), totalOver=list.reduce(function(t,r){return t+r.overdue;},0);
    box.querySelector('#db-sum').innerHTML='تعداد بدهکاران: <b>'+list.length+'</b> — مجموع بدهی: <b>'+esc(fmtMoney(totalRem))+'</b> — سررسید گذشته: <b>'+esc(fmtMoney(totalOver))+'</b>';
    renderDataTable(box.querySelector('#db-table'),{
      data:list, searchKeys:['id','name','phone'],
      onPrint:function(l){ printTable('گزارش بدهکاران'+(activeBranchLabel()?' — '+activeBranchLabel():''),['شماره','نام','صنف / کورس','تماس','مجموع','پرداخت‌شده','باقی‌مانده','سررسید گذشته','قدیمی‌ترین سررسید'], l.map(function(r){return [r.id,r.name,(r.classId?classLabel(r.classId):'')+(r.courses?' / '+r.courses:''),r.phone,fmtMoney(r.total),fmtMoney(r.paid),fmtMoney(r.remaining),r.overdue?fmtMoney(r.overdue):'—',r.oldestDue?fmtDate(r.oldestDue):'—'];})); },
      columns:[{key:'id',label:'شماره'},{key:'name',label:'نام'},{key:'classId',label:'صنف',render:function(r){return r.classId?esc(classLabel(r.classId)):'—';}},{key:'courses',label:'کورس‌ها'},{key:'phone',label:'تماس'},
        {key:'remaining',label:'باقی‌مانده',render:function(r){return fmtMoney(r.remaining);}},{key:'overdue',label:'سررسید گذشته',render:function(r){return r.overdue?fmtMoney(r.overdue):'—';}},{key:'oldestDue',label:'قدیمی‌ترین سررسید',render:function(r){return r.oldestDue?fmtDate(r.oldestDue):'—';}}],
      actions:function(r){ return can('fees.write')?iconBtn('<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/>','ثبت پرداخت','pay',r.id):''; },
      afterDraw:function(cont){ cont.querySelectorAll('[data-act="pay"]').forEach(function(b){ b.onclick=function(){ closeModal(box); openFeePaymentForm(b.getAttribute('data-id'),null,draw); }; }); }
    });
  }
  function openStructures(){
    var classes = DB.classes.filter(function(c){return c.academicYearId===yid;});
    var html = '<div class="modal-head"><h3>ساختار فیس صنوف — '+esc(yearLabel(yid))+'</h3><button class="icon-btn" id="fst-x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>'+
      '<div class="modal-body"><div class="table-wrap"><table><thead><tr><th>صنف</th><th>فیس ثبت‌نام</th><th>فیس ماهانه</th><th>تعداد ماه</th><th>فیس امتحان</th><th>سایر</th></tr></thead><tbody>'+
      classes.map(function(c){ var fs=feeStructureFor(c.id,yid)||{}; return '<tr data-cls="'+c.id+'"><td>'+esc(classLabel(c.id))+'</td>'+
        ['regFee','monthlyFee','monthsCount','examFee','otherFee'].map(function(k){ return '<td><input type="number" class="input-s fst-in" data-k="'+k+'" style="max-width:100px;" value="'+(fs[k]!==undefined?fs[k]:(k==='monthsCount'?12:0))+'"></td>'; }).join('')+'</tr>'; }).join('')+
      '</tbody></table></div></div><div class="modal-foot"><button class="btn btn-outline" id="fst-cancel">لغو</button><button class="btn btn-primary" id="fst-save">ذخیره</button></div>';
    var box = openModal(html,{size:'lg'});
    box.querySelector('#fst-x').onclick=function(){closeModal(box);};
    box.querySelector('#fst-cancel').onclick=function(){closeModal(box);};
    box.querySelector('#fst-save').onclick=function(){
      box.querySelectorAll('tr[data-cls]').forEach(function(tr){
        var cid = tr.getAttribute('data-cls');
        var fs = feeStructureFor(cid,yid);
        var vals={}; tr.querySelectorAll('.fst-in').forEach(function(inp){ vals[inp.getAttribute('data-k')]=Number(inp.value)||0; });
        if(fs) Object.assign(fs,vals); else { vals.id=genCode('fee'); vals.classId=cid; vals.yearId=yid; DB.feeStructures.push(vals); }
      });
      saveDB(['feeStructures']); logAct('ویرایش','فیس','ساختار فیس صنوف بروزرسانی شد.'); toast('ذخیره شد.','ok'); closeModal(box); draw();
    };
  }
};
function showReceiptModal(rec){
  var s = byId(DB.students, rec.studentId);
  var html = '<div class="modal-head"><h3>رسید پرداخت</h3><button class="icon-btn" id="rc2-x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>'+
    '<div class="modal-body"><div class="receipt-box" id="receipt-print-area">'+(BRAND.logo?'<div style="text-align:center;"><img src="'+BRAND.logo+'" style="height:48px;max-width:140px;object-fit:contain;"></div>':'')+'<h3>'+esc(brandName())+'</h3>'+(BRAND.address||BRAND.phone?'<div class="sub" style="font-size:11px;">'+[BRAND.address,BRAND.phone].filter(Boolean).map(esc).join(' — ')+'</div>':'')+((multiBranch()||RESTRICTED)&&rec.branchId?'<div class="sub" style="font-size:11px;">شعبه: '+esc(branchName(rec.branchId))+'</div>':'')+'<div class="sub">رسید پرداخت فیس</div>'+
    '<div class="receipt-row"><span>شماره رسید</span><b>'+esc(rec.receiptNo||rec.id)+'</b></div>'+
    '<div class="receipt-row"><span>شاگرد</span><b>'+esc(s?s.name:'—')+'</b></div>'+
    '<div class="receipt-row"><span>نوع فیس</span><b>'+esc(rec.type)+'</b></div>'+(rec.invoiceId&&byId(DB.studentFees,rec.invoiceId)?'<div class="receipt-row"><span>فیس‌نامه</span><b>'+esc(byId(DB.studentFees,rec.invoiceId).title)+'</b></div>':'')+
    '<div class="receipt-row"><span>تاریخ</span><b>'+fmtDate(rec.date)+'</b></div>'+
    '<div class="receipt-row"><span>روش پرداخت</span><b>'+esc(rec.method)+'</b></div>'+
    '<div class="receipt-amount">'+fmtMoney(rec.amount)+'</div>'+(s?'<div class="receipt-row"><span>باقی‌مانده‌ی شاگرد تا این لحظه</span><b>'+fmtMoney(studentBalance(s.id).remaining)+'</b></div>':'')+'</div></div>'+
    '<div class="modal-foot"><button class="btn btn-outline" id="rc2-cancel">بستن</button><button class="btn btn-primary" id="rc2-print">چاپ رسید</button></div>';
  var box = openModal(html,{size:'sm'});
  box.querySelector('#rc2-x').onclick=function(){closeModal(box);};
  box.querySelector('#rc2-cancel').onclick=function(){closeModal(box);};
  box.querySelector('#rc2-print').onclick=function(){ printDoc('Receipt-'+(rec.receiptNo||rec.id), box.querySelector('#receipt-print-area').outerHTML); };
}

/* ---------- حسابداری ساده مرکز آموزشی ---------- */
var EXPENSE_CATS=["معاش","کرایه","برق و آب","انترنت","تعمیراتی","لوازم درسی","سایر"];
PAGES.accounting = function(main){
  var yid = currentYearId();
  main.innerHTML = '<div class="page-head"><h1>حسابداری مرکز</h1><div class="actions"><button class="btn btn-primary" id="ac-add" data-page-add><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+SVG_ADD+'</svg> ثبت مصرف جدید</button></div></div>';
  var income = DB.feePayments.filter(function(p){return p.yearId===yid;}).reduce(function(s,p){return s+Number(p.amount);},0);
  var expenseRows = DB.expenses.filter(function(e){return e.yearId===yid;});
  var expense = expenseRows.reduce(function(s,e){return s+Number(e.amount);},0);
  var payrollPaid = DB.payroll.filter(function(p){return p.yearId===yid;}).reduce(function(s,p){return s+(Number(p.paidAmount)||0);},0);
  main.innerHTML += '<div class="stat-grid">'+
    '<div class="stat-card"><div class="stat-ic c-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">'+ICONS.accounting+'</svg></div><div><div class="stat-val">'+fmtMoney(income)+'</div><div class="stat-lbl">مجموع عواید</div></div></div>'+
    '<div class="stat-card"><div class="stat-ic c-red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">'+ICONS.accounting+'</svg></div><div><div class="stat-val">'+fmtMoney(expense)+'</div><div class="stat-lbl">مجموع مصارف</div></div></div>'+
    '<div class="stat-card"><div class="stat-ic c-navy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">'+ICONS.accounting+'</svg></div><div><div class="stat-val">'+fmtMoney(income-expense-payrollPaid)+'</div><div class="stat-lbl">مانده خالص (بعد از مصارف و معاشات)</div></div></div>'+
    '<div class="stat-card"><div><div class="stat-val" id="ac-payroll">'+fmtMoney(payrollPaid)+'</div><div class="stat-lbl">معاشات پرداخت‌شده</div></div></div></div>';
  main.innerHTML += '<div class="card card-pad"><div class="section-title">مصارف مرکز</div><div id="ac-table"></div></div>';
  main.querySelector('#ac-add').onclick=function(){ openForm(); };
  draw();
  function draw(){
    renderDataTable(main.querySelector('#ac-table'),{
      data: expenseRows, searchKeys:['title'], filters:[{key:'category',label:'دسته',options:EXPENSE_CATS}],
      columns:[{key:'title',label:'عنوان'},{key:'category',label:'دسته'},{key:'amount',label:'مبلغ',render:function(r){return fmtMoney(r.amount);}},{key:'date',label:'تاریخ',render:function(r){return fmtDate(r.date);}},{key:'payer',label:'پرداخت‌کننده'}],
      actions:function(r){ return iconBtn(SVG_EDIT,'ویرایش','edit',r.id)+iconBtn(SVG_DELETE,'حذف','del',r.id); }
    });
    var tbl = main.querySelector('#ac-table');
    bindOnce(tbl, 'click', function(e){
      var b=e.target.closest('[data-act]'); if(!b) return;
      var id=b.getAttribute('data-id'), act=b.getAttribute('data-act'), rec=byId(DB.expenses,id);
      if(act==='edit') openForm(rec);
      else if(act==='del') confirmDelete('حذف مصرف','آیا از حذف «'+rec.title+'» مطمئن هستید؟', function(){
        DB.expenses = DB.expenses.filter(function(x){return x.id!==id;}); saveDB(['expenses']);
        logAct('حذف','حسابداری','مصرف «'+rec.title+'» حذف شد.'); toast('حذف شد.','ok'); draw(); PAGES.accounting(main);
      });
    });
  }
  function openForm(rec){
    openFormModal({
      title: rec?'ویرایش مصرف':'ثبت مصرف جدید',
      fields:[{name:'title',label:'عنوان',required:true,full:true},{name:'category',label:'دسته',type:'select',required:true,options:EXPENSE_CATS},
        {name:'amount',label:'مبلغ',type:'number',required:true},{name:'date',label:'تاریخ',type:'date',required:true},
        {name:'payer',label:'پرداخت‌کننده',placeholder:'صندوق مرکز'},{name:'note',label:'یادداشت',type:'textarea',full:true}],
      data: rec||{date:todayISO(),payer:'صندوق مرکز'},
      onSubmit:function(data){
        if(rec){ Object.assign(rec,data); saveDB(['expenses']); logAct('ویرایش','حسابداری','مصرف «'+rec.title+'» ویرایش شد.'); toast('ذخیره شد.','ok'); }
        else { data.id=genCode('expense'); data.yearId=yid; DB.expenses.push(data); saveDB(['expenses']); logAct('افزودن','حسابداری','مصرف جدید «'+data.title+'» ثبت شد.'); toast('ثبت شد.','ok'); }
        PAGES.accounting(main);
      }
    });
  }
};

/* ---------- اطلاعیه‌ها ---------- */
PAGES.announcements = function(main){
  main.innerHTML = '<div class="page-head"><h1>اطلاعیه‌ها</h1><div class="actions"><button class="btn btn-primary" id="an-add" data-page-add><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+SVG_ADD+'</svg> اطلاعیه جدید</button></div></div>'+
    '<div class="card card-pad"><div id="an-table"></div></div>';
  draw();
  main.querySelector('#an-add').onclick=function(){ openForm(); };
  function draw(){
    renderDataTable(main.querySelector('#an-table'),{
      data: DB.announcements.slice().reverse(), searchKeys:['title','body'],
      columns:[{key:'title',label:'عنوان'},{key:'date',label:'تاریخ',render:function(r){return fmtDate(r.date);}},{key:'audience',label:'مخاطب'}],
      actions:function(r){ return iconBtn(SVG_VIEW,'مشاهده','view',r.id)+iconBtn(SVG_EDIT,'ویرایش','edit',r.id)+iconBtn(SVG_DELETE,'حذف','del',r.id); }
    });
    var tbl = main.querySelector('#an-table');
    bindOnce(tbl, 'click', function(e){
      var b=e.target.closest('[data-act]'); if(!b) return;
      var id=b.getAttribute('data-id'), act=b.getAttribute('data-act'), rec=byId(DB.announcements,id);
      if(act==='edit') openForm(rec);
      else if(act==='view') openModal('<div class="modal-head"><h3>'+esc(rec.title)+'</h3><button class="icon-btn" id="anv-x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="modal-body"><p style="font-size:13px;white-space:pre-wrap;">'+esc(rec.body)+'</p></div>',{size:'sm'}).querySelector('#anv-x').onclick=function(e2){closeModal(e2.target.closest('.modal-overlay'));};
      else if(act==='del') confirmDelete('حذف اطلاعیه','آیا از حذف «'+rec.title+'» مطمئن هستید؟', function(){
        DB.announcements = DB.announcements.filter(function(a){return a.id!==id;}); saveDB(['announcements']);
        logAct('حذف','اطلاعیه‌ها','اطلاعیه «'+rec.title+'» حذف شد.'); toast('حذف شد.','ok'); draw();
      });
    });
  }
  function openForm(rec){
    openFormModal({
      title: rec?'ویرایش اطلاعیه':'اطلاعیه جدید', size:'lg',
      fields:[{name:'title',label:'عنوان',required:true,full:true},{name:'audience',label:'مخاطب',type:'select',options:['همه','والدین','استادان','کارمندان']},
        {name:'date',label:'تاریخ',type:'date',required:true},{name:'body',label:'متن اطلاعیه',type:'textarea',required:true,full:true}],
      data: rec||{date:todayISO(),audience:'همه'},
      onSubmit:function(data){
        if(rec){ Object.assign(rec,data); saveDB(['announcements']); logAct('ویرایش','اطلاعیه‌ها','اطلاعیه «'+rec.title+'» ویرایش شد.'); toast('ذخیره شد.','ok'); }
        else { data.id=genCode('announce'); DB.announcements.push(data); saveDB(['announcements']); pushNotification('اطلاعیه جدید: '+data.title,'info'); logAct('افزودن','اطلاعیه‌ها','اطلاعیه جدید «'+data.title+'» ایجاد شد.'); toast('ثبت شد.','ok'); }
        draw();
      }
    });
  }
};

/* ---------- اسناد ---------- */
PAGES.documents = function(main){
  main.innerHTML = '<div class="page-head"><h1>اسناد</h1><div class="actions"><button class="btn btn-primary" id="dc-add" data-page-add><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+SVG_ADD+'</svg> افزودن سند</button></div></div>'+
    '<div class="card card-pad"><div id="dc-table"></div></div>';
  draw();
  main.querySelector('#dc-add').onclick=function(){ openDocumentForm(); };
  function draw(){
    renderDataTable(main.querySelector('#dc-table'),{
      data: DB.documents, searchKeys:['title'],
      filters:[{key:'relatedType',label:'مرتبط با',options:[{value:'student',label:'شاگرد'},{value:'teacher',label:'استاد'},{value:'staff',label:'کارمند'},{value:'school',label:'مرکز'}]}],
      columns:[{key:'title',label:'عنوان'},{key:'relatedType',label:'مرتبط با',render:function(r){return docRelatedLabel(r);}},{key:'date',label:'تاریخ',render:function(r){return fmtDate(r.date);}},{key:'fileId',label:'فایل پیوست',render:function(r){return r.fileId?statusBadge('پیوست‌شده'):'—';}}],
      actions:function(r){ return iconBtn('<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>','پیوست/جایگزینی فایل','attach',r.id)+(r.fileId?iconBtn('<path d="M12 15V3M7 10l5 5 5-5"/><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>','دانلود فایل','download',r.id):'')+iconBtn(SVG_EDIT,'ویرایش','edit',r.id)+iconBtn(SVG_DELETE,'حذف','del',r.id); }
    });
    var tbl = main.querySelector('#dc-table');
    bindOnce(tbl, 'click', function(e){
      var b=e.target.closest('[data-act]'); if(!b) return;
      var id=b.getAttribute('data-id'), act=b.getAttribute('data-act'), rec=byId(DB.documents,id);
      if(act==='edit') openDocumentForm(rec);
      else if(act==='attach') attachDocumentFile(rec);
      else if(act==='download') downloadDocumentFile(rec);
      else if(act==='del') confirmDelete('حذف سند','آیا از حذف «'+rec.title+'» مطمئن هستید؟', function(){
        DB.documents = DB.documents.filter(function(d){return d.id!==id;}); saveDB(['documents']);
        logAct('حذف','اسناد','سند «'+rec.title+'» حذف شد.'); toast('حذف شد.','ok'); draw();
      });
    });
  }
  window.__docsDraw = draw;
};
function docRelatedLabel(d){
  if(d.relatedType==='student') return 'شاگرد: '+studentName(d.relatedId);
  if(d.relatedType==='teacher') return 'استاد: '+teacherName(d.relatedId);
  if(d.relatedType==='staff'){ var s=byId(DB.staff,d.relatedId); return 'کارمند: '+(s?s.name:'—'); }
  return 'مرکز';
}
function openDocumentForm(rec, prefill){

  openFormModal({

      else { data.id=genCode('doc'); DB.documents.push(data); saveDB(['documents']); logAct('افزودن','اسناد','سند جدید «'+data.title+'» ثبت شد.'); }

function attachDocumentFile(doc){
  openFilePickerModal('پیوست فایل سند — '+doc.title, '', function(info){
    doc.fileId = info.fid; doc.fileName = info.name;
    saveDB(['documents']); logAct('ویرایش','اسناد','فایل سند «'+doc.title+'» پیوست شد.');
    if(window.__docsDraw) window.__docsDraw();
    render();
  });
}
function downloadDocumentFile(doc){
  if(!doc.fileId){ toast('فایلی پیوست نشده است.','err'); return; }
  API.fileGet(doc.fileId).then(function(b64){
    if(!b64){ toast('فایل یافت نشد.','err'); return; }
    var a = document.createElement('a');
    a.href = 'data:application/octet-stream;base64,'+b64;
    a.download = doc.fileName || (doc.title+'.bin');
    document.body.appendChild(a); a.click(); a.remove();
  });
}

PAGES.search = function(main){
  main.innerHTML = '<div class="page-head"><h1>جستجوی پیشرفته</h1></div>'+
    '<div class="card card-pad"><div class="toolbar"><input class="input-s" id="gs-input" placeholder="نام، شماره، شماره تماس..."><button class="btn btn-primary btn-sm" id="gs-btn">جستجو</button></div><div id="gs-out"></div></div>';
  main.querySelector('#gs-btn').onclick = run;
  main.querySelector('#gs-input').addEventListener('keydown',function(e){ if(e.key==='Enter') run(); });
  function run(){
    var q = main.querySelector('#gs-input').value.trim().toLowerCase();
    var out = main.querySelector('#gs-out');
    if(!q){ out.innerHTML=''; return; }
    function matches(obj,keys){ return keys.some(function(k){ return obj[k] && String(obj[k]).toLowerCase().indexOf(q)>-1; }); }
    var students = activeStudents().filter(function(s){return matches(s,['id','name','fatherName','phone']);});
    var teachers = DB.teachers.filter(function(t){return matches(t,['name','phone']);});
    var parents = DB.parents.filter(function(p){return matches(p,['name','phone']);});
    var html='';
    html += resultBlock('شاگردان', students, function(s){return s.id+' - '+s.name;}, function(s){navTo('#/students/detail/'+s.id);});
    html += resultBlock('استادان', teachers, function(t){return t.name+' - '+(t.phone||'');}, function(t){navTo('#/teachers');});
    html += resultBlock('والدین', parents, function(p){return p.name+' - '+(p.phone||'');}, function(p){navTo('#/parents');});
    if(!students.length && !teachers.length && !parents.length) html = '<div class="empty-state"><p>هیچ نتیجه‌ای یافت نشد.</p></div>';
    out.innerHTML = html;
    out.querySelectorAll('[data-goto]').forEach(function(el,idx){ el.onclick = window.__gsHandlers[idx]; });
  }
  window.__gsHandlers = [];
  function resultBlock(title, list, labelFn, clickFn){
    if(!list.length) return '';
    var html = '<div class="section-title" style="margin-top:14px;">'+title+' ('+list.length+')</div><ul class="mini-list">';
    list.forEach(function(item){ window.__gsHandlers.push(function(){clickFn(item);}); html += '<li><div class="m1" style="cursor:pointer;color:var(--info);" data-goto>'+esc(labelFn(item))+'</div></li>'; });
    html += '</ul>'; return html;
  }
};

  main.querySelector('#rp-print').onclick = function(){

      var printHtml = groups.map(function(g){

      }).join('');
      printDoc('Report-'+type, '<div>'+printHeader(REPORT_TYPES[type].label)+printHtml+'</div>');
      return;
    }
    printTable(REPORT_TYPES[type].label, REPORT_TYPES[type].cols.map(colLabel), rows.map(function(r){return REPORT_TYPES[type].cols.map(function(c){return fmtCell(c,r);});}));
  };
  function getRows(){ var type = main.querySelector('#rp-type').value; return REPORT_TYPES[type].data(); }
  function groupRowsByClass(rows, type){
    var resolver = (REPORT_TYPES[type] && REPORT_TYPES[type].classOf) || function(r){ return r.classId; };
    var byC = {};
    rows.forEach(function(r){ var cid=resolver(r)||'_'; (byC[cid]=byC[cid]||[]).push(r); });
    return Object.keys(byC).map(function(cid){ return {classId:cid, label:cid==='_'?'— بدون صنف —':classLabel(cid), rows:byC[cid]}; })
      .sort(function(a,b){ return a.label.localeCompare(b.label,'fa'); });
  }
  function colLabel(c){ return ({id:'شماره',name:'نام',fatherName:'نام پدر',classId:'صنف',status:'وضعیت',date:'تاریخ',studentId:'شاگرد',examId:'امتحان',score:'نمره',type:'نوع',amount:'مبلغ',phone:'تماس',subject:'مضمون',role:'سمت',title:'عنوان',category:'دسته',user:'کاربر',action:'عمل',section:'بخش',remaining:'باقی‌مانده'})[c]||c; }
  function fmtCell(c,r){
    if(c==='classId') return classLabel(r.classId);
    if(c==='status') return r.status;
    if(c==='amount') return fmtMoney(r.amount);
    if(c==='remaining') return fmtMoney(studentBalance(r.id).remaining);
    if(c==='date') return fmtDate(r.date);
    if(c==='studentId') return studentName(r.studentId);
    if(c==='examId'){ var e=byId(DB.exams,r.examId); return e?e.title:'—'; }
    return r[c];
  }

    var rows = getRows(); var type = main.querySelector('#rp-type').value; var out = main.querySelector('#rp-out');
    if(!rows.length){ out.innerHTML = '<div class="empty-state"><p>هیچ اطلاعاتی یافت نشد.</p></div>'; return; }
    var cols = REPORT_TYPES[type].cols;

      var groups = groupRowsByClass(rows, type);
      out.innerHTML = groups.map(function(g){
        return '<div class="section-title" style="margin-top:14px;">'+esc(g.label)+' ('+g.rows.length+' شاگرد)</div>'+
          '<div class="table-wrap"><table><thead><tr>'+cols.map(function(c){return '<th>'+colLabel(c)+'</th>';}).join('')+'</tr></thead><tbody>'+
          g.rows.map(function(r){return '<tr>'+cols.map(function(c){return '<td>'+esc(fmtCell(c,r))+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';
      }).join('');
      return;
    }
    var html = '<div class="table-wrap"><table><thead><tr>'+cols.map(function(c){return '<th>'+colLabel(c)+'</th>';}).join('')+'</tr></thead><tbody>';
    rows.forEach(function(r){ html += '<tr>'+cols.map(function(c){return '<td>'+esc(fmtCell(c,r))+'</td>';}).join('')+'</tr>'; });
    html += '</tbody></table></div>'; out.innerHTML = html;
  }
  if(main.querySelector('#rp-type').value==='activity') refreshLogs().then(show); else show();
};

/* ---------- معاشات ---------- */
function payrollCalc(p){
  var base=Number(p.baseSalary)||0, add=Number(p.additions)||0, ded=Number(p.deductions)||0, paid=Number(p.paidAmount)||0;
  var net=round2(base+add-ded);
  return {net:net, remaining:round2(Math.max(0,net-paid)), status: paid>=net && net>0 ? 'پرداخت‌شده' : (paid>0 ? 'دارای باقی‌مانده' : 'در انتظار')};
}

        var c=payrollCalc(d); if(c.net<0) return {field:'deductions',msg:'کسورات نمی‌تواند از مجموع پایه و اضافات بیشتر باشد.'};

/* ---------- دارایی و گدام ---------- */
var ASSET_CATS=["اثاثیه","تجهیزات الکترونیکی","لوازم درسی","کتاب","ورزشی","لابراتوار","مواد مصرفی","سایر"];
var ASSET_COND=["نو","خوب","نیاز به تعمیر","خراب","از رده خارج"];
function assetIssued(assetId){ var n=0; DB.assetMovements.forEach(function(m){ if(m.assetId===assetId){ n += m.type==='issue'?Number(m.qty):-Number(m.qty); } }); return n; }
function assetAvailable(a){ return (Number(a.quantity)||0)-assetIssued(a.id); }
PAGES.assets = function(main){
  main.innerHTML='<div class="page-head"><h1>دارایی و گدام</h1><div class="actions"><button class="btn btn-primary" id="as-add" data-page-add><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+SVG_ADD+'</svg> ثبت وسیله</button></div></div><div class="card card-pad"><div id="as-table"></div></div>';
  main.querySelector('#as-add').onclick=function(){ openForm(); };
  draw();
  function draw(){
    renderDataTable(main.querySelector('#as-table'),{
      data:DB.assets.map(function(a){ return Object.assign({issued:assetIssued(a.id),available:assetAvailable(a)},a); }),
      searchKeys:['code','name','location','responsible'], filters:[{key:'category',label:'دسته',options:ASSET_CATS},{key:'condition',label:'وضعیت',options:ASSET_COND}],
      onPrint:function(l){ printTable('گزارش دارایی و گدام',['کد','نام','دسته','تعداد کل','تحویل‌شده','موجودی','محل','وضعیت','مسئول'],l.map(function(a){return [a.code,a.name,a.category,a.quantity,a.issued,a.available,a.location,a.condition,a.responsible];})); },
      columns:[{key:'code',label:'کد'},{key:'name',label:'نام'},{key:'category',label:'دسته'},{key:'quantity',label:'تعداد'},{key:'issued',label:'تحویل‌شده'},{key:'available',label:'موجودی'},{key:'location',label:'محل'},{key:'condition',label:'وضعیت'},{key:'responsible',label:'مسئول'}],
      actions:function(r){ return iconBtn(SVG_VIEW,'تاریخچه','history',r.id)+iconBtn('<path d="M5 12h14M12 5l7 7-7 7"/>','تحویل/دریافت','move',r.id)+iconBtn(SVG_EDIT,'ویرایش','edit',r.id)+iconBtn(SVG_DELETE,'حذف','del',r.id); }
    });
    bindOnce(main.querySelector('#as-table'),'click',function(e){
      var b=e.target.closest('[data-act]'); if(!b) return;
      var id=b.getAttribute('data-id'), act=b.getAttribute('data-act'), rec=byId(DB.assets,id);
      if(act==='edit') openForm(rec); else if(act==='history') showHistory(rec); else if(act==='move') openMove(rec);
      else if(act==='del'){
        if(assetIssued(id)!==0){ toast('این وسیله هنوز تحویل‌شده است و قابل حذف نیست.','err'); return; }
        confirmDelete('حذف وسیله','آیا از حذف «'+rec.name+'» مطمئن هستید؟',function(){ DB.assets=DB.assets.filter(function(x){return x.id!==id;}); DB.assetMovements=DB.assetMovements.filter(function(m){return m.assetId!==id;}); saveDB(['assets','assetMovements']); logAct('حذف','دارایی','وسیله «'+rec.name+'» حذف شد.'); toast('حذف شد.','ok'); draw(); });
      }
    });
  }
  function openForm(rec){
    openFormModal({title:rec?'ویرایش وسیله':'ثبت وسیله',size:'lg',
      fields:[{name:'name',label:'نام وسیله',required:true},{name:'code',label:'کد دارایی',required:true},{name:'category',label:'دسته',type:'select',options:ASSET_CATS,required:true},
        {name:'quantity',label:'تعداد',type:'number',required:true},{name:'location',label:'محل'},{name:'condition',label:'وضعیت',type:'select',options:ASSET_COND,required:true},
        {name:'responsible',label:'مسئول'},{name:'receivedDate',label:'تاریخ دریافت',type:'date'},{name:'notes',label:'یادداشت',type:'textarea',full:true}],
      data:rec||{condition:'نو',receivedDate:todayISO(),quantity:1},
      extraValidator:function(d){
        if(DB.assets.some(function(a){return a.code===d.code && (!rec||a.id!==rec.id);})) return {field:'code',msg:'این کد دارایی قبلاً استفاده شده است.'};
        if(!(Number(d.quantity)>=0) || Math.floor(d.quantity)!==Number(d.quantity)) return {field:'quantity',msg:'تعداد باید عدد صحیح باشد.'};
        if(rec && Number(d.quantity)<assetIssued(rec.id)) return {field:'quantity',msg:'تعداد کل کمتر از تعداد تحویل‌شده است.'};
        return true; },
      onSubmit:function(d){
        if(rec){ Object.assign(rec,d); logAct('ویرایش','دارایی','وسیله «'+rec.name+'» ویرایش شد.'); }
        else { d.id=genCode('asset'); DB.assets.push(d); logAct('افزودن','دارایی','وسیله «'+d.name+'» با کد '+d.code+' ثبت شد.'); }
        saveDB(['assets']); toast('ذخیره شد.','ok'); draw(); }});
  }
  function openMove(a){
    openFormModal({title:'تحویل/دریافت — '+a.name+' (موجودی: '+assetAvailable(a)+')',size:'sm',
      fields:[{name:'type',label:'نوع',type:'select',options:[{value:'issue',label:'تحویل‌دهی (خروج از گدام)'},{value:'return',label:'تحویل‌گیری (بازگشت به گدام)'}],required:true},
        {name:'qty',label:'تعداد',type:'number',required:true},{name:'person',label:'شخص (تحویل‌گیرنده/تحویل‌دهنده)',required:true},{name:'date',label:'تاریخ',type:'date',required:true},{name:'note',label:'یادداشت',type:'textarea',full:true}],
      data:{type:'issue',qty:1,date:todayISO()},
      extraValidator:function(d){
        var q=Number(d.qty); if(!(q>0)||Math.floor(q)!==q) return {field:'qty',msg:'تعداد باید عدد صحیح مثبت باشد.'};
        if(d.type==='issue' && q>assetAvailable(a)) return {field:'qty',msg:'تعداد از موجودی ('+assetAvailable(a)+') بیشتر است.'};
        if(d.type==='return' && q>assetIssued(a.id)) return {field:'qty',msg:'تعداد بازگشتی از مقدار تحویل‌شده ('+assetIssued(a.id)+') بیشتر است.'};
        return true; },
      onSubmit:function(d){ d.id=genCode('move'); d.assetId=a.id; d.qty=Number(d.qty); d.recordedBy=ME.name; DB.assetMovements.push(d); saveDB(['assetMovements']);
        logAct('ثبت','دارایی',(d.type==='issue'?'تحویل ':'دریافت ')+d.qty+' عدد «'+a.name+'» — '+d.person); toast('ثبت شد.','ok'); draw(); }});
  }
  function showHistory(a){
    var mv=DB.assetMovements.filter(function(m){return m.assetId===a.id;}).sort(function(x,y){return x.date<y.date?1:-1;});
    var box=openModal('<div class="modal-head"><h3>تاریخچه — '+esc(a.name)+'</h3><button class="icon-btn" id="ah-x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="modal-body"><div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>نوع</th><th>تعداد</th><th>شخص</th><th>ثبت‌کننده</th></tr></thead><tbody>'+
      (mv.length?mv.map(function(m){return '<tr><td>'+fmtDate(m.date)+'</td><td>'+(m.type==='issue'?'تحویل‌دهی':'تحویل‌گیری')+'</td><td>'+m.qty+'</td><td>'+esc(m.person)+'</td><td>'+esc(m.recordedBy||'')+'</td></tr>';}).join(''):'<tr><td colspan="5" style="text-align:center;">رویدادی ثبت نشده است.</td></tr>')+'</tbody></table></div></div>',{size:'lg'});
    box.querySelector('#ah-x').onclick=function(){ closeModal(box); };
  }
};

var SA_STATUS=[{k:'present',l:'حاضر'},{k:'absent',l:'غایب'},{k:'leave',l:'رخصت'},{k:'late',l:'تأخیر'}];
PAGES.staffAttendance = function(main){
  var yid=currentYearId(), date=todayISO(), state={};
  main.innerHTML='<div class="page-head"><h1>حاضری استادان و کارمندان</h1><div class="actions"><input type="date" class="input-s" id="sa-date" value="'+date+'" style="max-width:160px;"><button class="btn btn-primary" id="sa-save" data-page-add>ذخیره حاضری</button></div></div>'+
    '<div class="card card-pad"><div id="sa-list"></div></div><div class="card card-pad" style="margin-top:16px;"><div class="section-title">گزارش ماهانه</div><div style="display:flex;gap:8px;margin-bottom:10px;"><input type="month" class="input-s" id="sa-month" value="'+periodNow()+'" style="max-width:160px;"><button class="btn btn-outline" id="sa-report">نمایش گزارش</button><button class="btn btn-outline" id="sa-print">چاپ / PDF</button></div><div id="sa-rep"></div></div>';

  function drawList(){
    var emps=employeesList();
    main.querySelector('#sa-list').innerHTML= emps.length ? '<table><thead><tr><th>نام</th><th>نوع</th><th>وضعیت</th></tr></thead><tbody>'+emps.map(function(e){
      return '<tr><td>'+esc(e.name)+'</td><td>'+e.kind+'</td><td>'+SA_STATUS.map(function(s){return '<button type="button" class="att-chip '+(state[e.id]===s.k?'on-'+s.k:'')+'" data-emp="'+e.id+'" data-st="'+s.k+'" '+(canWrite?'':'disabled')+'>'+s.l+'</button>';}).join(' ')+'</td></tr>'; }).join('')+'</tbody></table>' : '<div class="empty">هیچ استاد یا کارمند فعالی ثبت نشده است.</div>';
    main.querySelectorAll('[data-emp]').forEach(function(b){ b.onclick=function(){ state[b.getAttribute('data-emp')]=b.getAttribute('data-st'); drawList(); }; });
  }
  main.querySelector('#sa-date').onchange=function(e){ date=e.target.value||todayISO(); load(); };
  main.querySelector('#sa-save').onclick=function(){
    var i=DB.staffAttendance.findIndex(function(a){return a.date===date && a.yearId===yid;});
    if(i>=0) DB.staffAttendance[i].records=Object.assign({},state); else DB.staffAttendance.push({id:genCode('staffatt'),yearId:yid,date:date,records:Object.assign({},state)});
    saveDB(['staffAttendance']); logAct('ثبت حاضری','حاضری کارکنان','حاضری کارکنان در تاریخ '+date+' ثبت شد.'); toast('حاضری ذخیره شد.','ok');
  };
  function monthRows(){
    var m=main.querySelector('#sa-month').value;
    return employeesList().map(function(e){ var c={present:0,absent:0,leave:0,late:0};
      DB.staffAttendance.filter(function(a){return a.yearId===yid && a.date.slice(0,7)===m;}).forEach(function(a){ var st=a.records[e.id]; if(st) c[st]++; });
      return [e.name,e.kind,c.present,c.absent,c.leave,c.late]; });
  }
  main.querySelector('#sa-report').onclick=function(){
    main.querySelector('#sa-rep').innerHTML='<table><thead><tr><th>نام</th><th>نوع</th><th>حاضر</th><th>غایب</th><th>رخصت</th><th>تأخیر</th></tr></thead><tbody>'+monthRows().map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>'; };
  main.querySelector('#sa-print').onclick=function(){ printTable('گزارش ماهانه حاضری کارکنان '+main.querySelector('#sa-month').value,['نام','نوع','حاضر','غایب','رخصت','تأخیر'],monthRows()); };
  load();
};

function openPermsEditor(){

      var perms=[]; box.querySelectorAll('[data-perm]').forEach(function(c){ if(c.checked) perms.push(c.getAttribute('data-perm')); });

  });
}

/* ---------- خروجی گرفتن (چاپ): Word / Excel / PDF / تصویر / CSV / صفحه وب ---------- */
var DOC_TITLE = /^(قرارداد|کارت|Karnama|Progress|فیس‌نامه|Receipt|رسید|گزارش ولی|مشخصات)/, LIST_TITLE = /^(لیست|گزارش|Report-|نتایج)/;
function printKindFor(title){ title=String(title||''); return DOC_TITLE.test(title)?'docx':LIST_TITLE.test(title)?'xlsx':''; }
if(window.__E2E_HOOK){ window.__printKind = printKindFor; }
var EXPORT_FORMATS = [
  {id:'docx',label:'Word',ext:'.docx',desc:'سند قابل ویرایش؛ از Word چاپ کنید'},
  {id:'xlsx',label:'Excel',ext:'.xlsx',desc:'جدول قابل محاسبه، فیلتر و مرتب‌سازی'},
  {id:'pdf',label:'PDF',ext:'.pdf',desc:'فایل ثابت برای ارسال و چاپ'},
  {id:'png',label:'تصویر',ext:'.png',desc:'هر صفحه یک عکس (برای ارسال در پیام‌رسان)'},
  {id:'csv',label:'CSV',ext:'.csv',desc:'داده‌ی خام جدول‌ها برای برنامه‌های دیگر'},
  {id:'html',label:'صفحه وب',ext:'.html',desc:'باز شدن در مرورگر و چاپ از آنجا'}
];
function printMode(){
  var m = (ME && ME.printMode) || (DB && DB.settings && DB.settings.printMode) || 'ask';
  return Kind.PRINT_MODES.indexOf(m)>=0 ? m : 'ask';
}
function printFileBase(title){ return String(title).replace(/[^\w\u0600-\u06FF\-]+/g,'-').slice(0,80); }
function printDocPdf(title, bodyHtml){
  var name = printFileBase(title)+'.pdf';
  return API.printPDF(name, buildPrintHtml(title, bodyHtml)).then(function(r){
    if(r && r.__error){ toast(r.__error,'err'); return null; }
    if(r){ toast('PDF ذخیره شد ('+Math.round(r.size/1024)+' KB).','ok'); }
    return r;
  });
}
/* صفحه‌ی چاپی (HTML) ⇒ تصویرهای PNG به اندازه‌ی صفحه‌ی A4 (SVG foreignObject ⇒ بوم)؛ بدون هیچ کتابخانه‌ی بیرونی */
function htmlToPngPages(html){
  return new Promise(function(resolve,reject){
    var W=794, PH=1123, SC=2, fr=document.createElement('iframe');
    fr.setAttribute('sandbox','allow-same-origin'); fr.style.cssText='position:fixed;left:-12000px;top:0;width:'+W+'px;height:1200px;border:0;visibility:hidden;';
    var done=function(err,res){ try{ document.body.removeChild(fr); }catch(e){} err?reject(err):resolve(res); };
    fr.onload=function(){ setTimeout(function(){ try{
      var d=fr.contentDocument, H=Math.max(PH, Math.ceil(d.documentElement.scrollHeight)), n=Math.ceil(H/PH);
      if(n>40){ done(new Error('سند برای تصویر بسیار طولانی است؛ Word، Excel یا PDF را انتخاب کنید.')); return; }
      var css=[].map.call(d.querySelectorAll('style'),function(x){return x.textContent;}).join('\n').replace(/@page[^{}]*\{[^{}]*\}/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
      var body=new XMLSerializer().serializeToString(d.body);
      var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"><foreignObject x="0" y="0" width="'+W+'" height="'+H+'"><div xmlns="http://www.w3.org/1999/xhtml" style="width:'+W+'px;background:#fff;"><style>'+css+'</style>'+body+'</div></foreignObject></svg>';
      var img=new Image();
      img.onload=function(){ try{ var pages=[]; for(var i=0;i<n;i++){ var y=i*PH, h=Math.min(PH,H-y), cv=document.createElement('canvas'); cv.width=W*SC; cv.height=h*SC; var g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height); g.drawImage(img,0,-y*SC,W*SC,H*SC); pages.push(cv.toDataURL('image/png')); } done(null,pages); }catch(e){ done(new Error('ساخت تصویر ممکن نشد ('+e.message+')')); } };
      img.onerror=function(){ done(new Error('ساخت تصویر ممکن نشد.')); };
      img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    }catch(e){ done(e); } },150); };
    document.body.appendChild(fr); fr.srcdoc=html;
  });
}
if(window.__E2E_HOOK){ window.__htmlToPngPages = htmlToPngPages; }

function reportSaved(r, label){
  if(!r) return r;
  if(r.__error){ toast(r.__error,'err'); return null; }
  if(r.opened){ toast(label+' ذخیره شد و باز شد.','ok'); }
  else { var p=(r.paths&&r.paths[0])||r.path; toast('فایل '+label+' ذخیره شد اما برنامه‌ای برای باز کردن آن پیدا نشد. محل فایل: '+p,'err'); if(p) API.showInFolder(p); }
  return r;
}
function runExport(format, ctx){
  var name = printFileBase(ctx.title);
  if(format==='pdf') return printDocPdf(ctx.title, ctx.bodyHtml);
  if(format==='docx'||format==='xlsx'){
    return API.printOffice({kind:format, title:ctx.title, name:name, model:ctx.model}).then(function(r){
      if(r && r.__error) throw new Error(r.__error);
      if(r && r.opened){ toast('در '+r.app+' باز شد.','ok'); } else if(r){ toast('فایل '+r.app+' ذخیره شد اما برنامه‌ای برای باز کردن آن پیدا نشد. محل فایل: '+r.path,'err'); API.showInFolder(r.path); }
      return r;
    }).catch(function(e){ toast('ساخت فایل Word/Excel ممکن نشد ('+e.message+')؛ به‌جای آن PDF ساخته می‌شود.','err'); return printDocPdf(ctx.title, ctx.bodyHtml); });
  }
  if(format==='png') return htmlToPngPages(ctx.html).then(function(pages){ return API.printSaveFiles({name:name, files:pages.map(function(d){return {ext:'png',data:d};})}); }).then(function(r){ return reportSaved(r, pages_label(r)); }).catch(function(e){ toast(e.message,'err'); return null; });
  if(format==='csv'){ if(!Kind.hasTable(ctx.model)){ toast('این سند جدول ندارد؛ CSV ممکن نیست.','err'); return Promise.resolve(null); } return API.printSaveFiles({name:name, files:[{ext:'csv',text:Kind.toCsv(ctx.model)}]}).then(function(r){ return reportSaved(r,'CSV'); }); }
  if(format==='html') return API.printSaveFiles({name:name, files:[{ext:'html',text:ctx.html}]}).then(function(r){ return reportSaved(r,'صفحه وب'); });
  return Promise.resolve(null);
}
function pages_label(r){ return r && r.count>1 ? ('تصویر ('+r.count+' صفحه)') : 'تصویر'; }
/* پنجره‌ی انتخاب قالب خروجی؛ قالب پیشنهادی برجسته است */
function askPrintFormat(title, model, recommended){
  return new Promise(function(resolve){
    var canCsv = Kind.hasTable(model);
    var html = '<div class="modal-head"><h3>خروجی گرفتن — '+esc(title)+'</h3><button class="icon-btn" id="pf-x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="modal-body" id="pf-dialog">'+
      '<div id="pf-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;">'+EXPORT_FORMATS.map(function(f){
        var dis = f.id==='csv' && !canCsv, rec = f.id===recommended;
        return '<button type="button" class="btn '+(rec?'btn-primary':'btn-outline')+' pf-btn" data-pf="'+f.id+'" '+(dis?'disabled title="این سند جدول ندارد"':'')+' style="display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px;text-align:right;height:auto;'+(dis?'opacity:.45;':'')+'"><span style="font-size:14px;font-weight:700;">'+esc(f.label)+' <small style="opacity:.75;font-weight:400;direction:ltr;display:inline-block;">'+f.ext+'</small>'+(rec?' <span class="badge" style="background:#fff;color:var(--navy);">پیشنهادی</span>':'')+'</span><span style="font-size:11.5px;font-weight:400;opacity:.85;">'+esc(f.desc)+'</span></button>'; }).join('')+'</div>'+
      '<label style="display:flex;align-items:center;gap:6px;margin-top:14px;font-size:12.5px;cursor:pointer;"><input type="checkbox" id="pf-remember"> برای حساب من، همیشه از همین گزینه استفاده شود (در «تنظیمات ← ظاهر و خروجی من» قابل تغییر است)</label></div>'+
      '<div class="modal-foot"><button class="btn btn-outline" id="pf-cancel">انصراف</button></div>';
    var box=openModal(html,{size:'lg'}), finished=false;
    var finish=function(v){ if(finished) return; finished=true; closeModal(box); resolve(v); };
    box.querySelector('#pf-x').onclick=box.querySelector('#pf-cancel').onclick=function(){ finish(null); };
    Array.prototype.forEach.call(box.querySelectorAll('.pf-btn'),function(b){ b.onclick=function(){ finish({format:b.getAttribute('data-pf'), remember:box.querySelector('#pf-remember').checked}); }; });
    var rb=box.querySelector('.pf-btn[data-pf="'+recommended+'"]'); if(rb) rb.focus();
  });
}
function printDoc(title, bodyHtml, opts){
  opts = opts||{};
  var mode = printMode();
  if(mode==='pdf') return printDocPdf(title, bodyHtml);
  var html = buildPrintHtml(title, bodyHtml);
  return htmlToModel(html, title).then(function(model){
    var hint = opts.kind || printKindFor(title), rec = Kind.chooseKind(model, hint), ctx = {title:title, bodyHtml:bodyHtml, html:html, model:model};
    if(mode==='ask'){
      return askPrintFormat(title, model, rec).then(function(ch){
        if(!ch) return null;
        if(ch.remember) saveMyPrefs({printMode:ch.format}).then(function(r){ if(r) toast('از این پس خروجی شما «'+ch.format+'» است؛ از «ظاهر و خروجی من» قابل تغییر است.','ok'); });
        return runExport(ch.format, ctx);
      });
    }
    return runExport(mode==='auto' ? rec : mode, ctx);
  }).catch(function(e){
    toast('آماده‌سازی خروجی ممکن نشد ('+e.message+')؛ به‌جای آن PDF ساخته می‌شود.','err');
    return printDocPdf(title, bodyHtml);
  });
}
function printTable(title, headers, rows){
  return printDoc(title, '<div>'+printHeader(title)+
    '<table><thead><tr>'+headers.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr></thead><tbody>'+
    rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>', {kind:'xlsx'});
}
function printGeneric(title, pairs){
  return printDoc(title, '<div>'+printHeader(title)+'<table>'+pairs.map(function(p){return '<tr><td style="font-weight:bold;width:35%;">'+esc(p[0])+'</td><td>'+esc(p[1])+'</td></tr>';}).join('')+'</table></div>', {kind:'docx'});
}

/* =========================================================================
   بخش ۱۲: THEME / INIT / AUTH SCREENS
   ========================================================================= */
function applyTheme(){ document.documentElement.setAttribute('data-theme', DB.settings.theme||'light'); }
function showLogin(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-screen').style.display='none';
  document.getElementById('login-username').value='';
  document.getElementById('login-password').value='';
  document.getElementById('login-error').style.display='none';
  var fp = document.getElementById('force-pw'); if(fp) fp.remove();
  API.brandingGet().then(function(b){ if(b && !b.__error) applyBranding(b); });
  API.authState().then(function(st){
    var setup = !!(st && st.needsSetup);
    document.getElementById('login-form').style.display = setup ? 'none' : 'block';
    document.getElementById('setup-form').style.display = setup ? 'block' : 'none';
    document.getElementById('forgot-pass-link').style.display = (!setup && st && st.hasRecovery) ? 'inline-block' : 'none';
  });
}
function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  applyTheme();
  if(!window.location.hash) window.location.hash = '#/dashboard';
  render();
}
function enterApp(){ return loadDB().then(function(){ showApp(); }).catch(function(err){ toast('خطا در بارگذاری اطلاعات: '+err.message,'err'); }); }
// تغییر اجباری رمز: پنجره‌ی غیرقابل‌بستن؛ main تا تغییر رمز همه‌ی IPCهای دیگر را رد می‌کند.
function openForcePasswordModal(oldPassword){
  var ov = document.createElement('div'); ov.id='force-pw';
  ov.style.cssText='position:fixed;inset:0;background:rgba(10,20,40,.72);z-index:9999;display:flex;align-items:center;justify-content:center;';
  ov.innerHTML = '<div class="modal-box modal-sm show" style="background:var(--white);border-radius:12px;max-width:400px;width:92%;"><div class="modal-head"><h3>تغییر رمز عبور (الزامی)</h3></div>'+
    '<div class="modal-body"><div class="help-banner">برای ادامه، یک رمز عبور جدید انتخاب کنید (حداقل ۸ کاراکتر، شامل حرف و عدد).</div>'+
    '<div class="field"><label>رمز عبور فعلی</label><input type="password" id="fp-old" value="'+esc(oldPassword||'')+'"></div>'+
    '<div class="field"><label>رمز عبور جدید</label><input type="password" id="fp-new"></div>'+
    '<div class="field"><label>تکرار رمز عبور جدید</label><input type="password" id="fp-new2"></div><div class="login-error" id="fp-err" style="display:none;"></div></div>'+
    '<div class="modal-foot"><button class="btn btn-outline" id="fp-logout">خروج</button><button class="btn btn-primary" id="fp-save">ذخیره و ادامه</button></div></div>';
  document.body.appendChild(ov);
  function err(m){ var e=ov.querySelector('#fp-err'); e.textContent=m; e.style.display='block'; }
  ov.querySelector('#fp-logout').onclick=function(){ ov.remove(); doLogout(); };
  ov.querySelector('#fp-save').onclick=function(){
    var o=ov.querySelector('#fp-old').value, n=ov.querySelector('#fp-new').value, n2=ov.querySelector('#fp-new2').value;
    if(n!==n2){ err('تکرار رمز عبور یکسان نیست.'); return; }
    API.authChangePassword(o,n).then(function(res){
      if(res && res.__error){ err(res.__error); return; }
      ov.remove(); toast('رمز عبور تغییر کرد.','ok'); enterApp();
    });
  };
}
function openProfileModal(){
  var u = currentUser(); if(!u) return;
  var html = '<div class="modal-head"><h3>پروفایل کاربر</h3><button class="icon-btn" id="pf-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>'+
    '<div class="modal-body"><div class="detail-grid">'+di('نام',esc(u.name))+di('نام کاربری',esc(u.username))+di('نقش',esc(ROLE_LABELS[u.role]||u.role))+'</div>'+
    '<div class="section-title">تغییر رمز عبور</div>'+
    '<div class="field"><label>رمز عبور فعلی</label><input type="password" id="pf-oldpass"></div>'+
    '<div class="field"><label>رمز عبور جدید (حداقل ۸ کاراکتر، حرف و عدد)</label><input type="password" id="pf-newpass"></div></div>'+
    '<div class="modal-foot"><button class="btn btn-outline" id="pf-logout">خروج از سیستم</button><button class="btn btn-primary" id="pf-savepass">ذخیره رمز جدید</button></div>';
  var box = openModal(html,{size:'sm'});
  box.querySelector('#pf-close').onclick=function(){closeModal(box);};
  box.querySelector('#pf-logout').onclick=function(){ closeModal(box); doLogout(); };
  box.querySelector('#pf-savepass').onclick=function(){
    API.authChangePassword(box.querySelector('#pf-oldpass').value, box.querySelector('#pf-newpass').value).then(function(res){
      if(res && res.__error){ toast(res.__error,'err'); return; }
      toast('رمز عبور تغییر کرد.','ok'); closeModal(box);
    });
  };
}
function openForgotPasswordModal(){
  var html = '<div class="modal-head"><h3>بازیابی رمز عبور مدیر سیستم</h3><button class="icon-btn" id="fg-x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>'+
    '<div class="modal-body"><div class="help-banner">کد بازیابی هنگام راه‌اندازی اولیه به مدیر سیستم نمایش داده شده است (فقط یک‌بار). اگر آن را ندارید، باید از نسخه‌ی پشتیبان استفاده شود.</div>'+
    '<div class="field"><label>کد بازیابی</label><input type="text" id="fg-code" style="text-align:center;letter-spacing:2px;direction:ltr;" placeholder="XXXX-XXXX-XXXX-XXXX"></div>'+
    '<div class="field"><label>رمز عبور جدید (حداقل ۸ کاراکتر، حرف و عدد)</label><input type="password" id="fg-newpass"></div></div>'+
    '<div class="modal-foot"><button class="btn btn-outline" id="fg-cancel">لغو</button><button class="btn btn-primary" id="fg-ok">بازیابی رمز عبور</button></div>';
  var box = openModal(html,{size:'sm'});
  box.querySelector('#fg-x').onclick=function(){closeModal(box);};
  box.querySelector('#fg-cancel').onclick=function(){closeModal(box);};
  box.querySelector('#fg-ok').onclick=function(){
    var code = box.querySelector('#fg-code').value.trim(), np = box.querySelector('#fg-newpass').value;
    if(!code){ toast('کد بازیابی را وارد کنید.','err'); return; }
    API.recoveryReset(code, np).then(function(res){
      if(res && res.__error){ toast(res.__error,'err'); return; }
      closeModal(box);
      showSecretOnce('رمز بازیابی شد — کد بازیابی جدید', res.newRecoveryCode, 'کد قبلی باطل شد. کد جدید را همین حالا یادداشت کنید؛ دیگر نمایش داده نمی‌شود. اکنون با نام کاربری «'+res.username+'» و رمز جدید وارد شوید.');
    });
  };
}
document.addEventListener('DOMContentLoaded', function(){
  if(!API){ document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:Tahoma;">این برنامه باید از طریق نسخه دسکتاپ (Electron) اجرا شود.</div>'; return; }
  function loginError(m){ var e=document.getElementById('login-error'); e.textContent=m; e.style.display='block'; }
  document.getElementById('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    var uVal=document.getElementById('login-username').value.trim(), pVal=document.getElementById('login-password').value;
    if(!uVal || !pVal){ loginError('لطفاً نام کاربری و رمز عبور را وارد کنید.'); return; }
    var btn=e.target.querySelector('button[type=submit]'); btn.disabled=true;
    doLogin(uVal,pVal).then(function(res){
      btn.disabled=false;
      if(!res.ok){ loginError(res.msg); return; }
      document.getElementById('login-password').value='';
      if(res.mustChange) { document.getElementById('login-screen').style.display='none'; openForcePasswordModal(pVal); } else enterApp();
    });
  });
  document.getElementById('setup-form').addEventListener('submit', function(e){
    e.preventDefault();
    var d={username:document.getElementById('su-username').value.trim(), name:document.getElementById('su-name').value.trim(), password:document.getElementById('su-pass').value};
    if(d.password!==document.getElementById('su-pass2').value){ loginError('تکرار رمز عبور یکسان نیست.'); return; }
    API.authSetup(d).then(function(res){
      if(res && res.__error){ loginError(res.__error); return; }
      applySession(res);
      enterApp().then(function(){ showSecretOnce('کد بازیابی رمز عبور', res.recoveryCode, 'این کد فقط همین یک‌بار نمایش داده می‌شود. آن را روی کاغذ یادداشت و در جای امن (خارج از این کامپیوتر) نگهداری کنید؛ در صورت فراموشی رمز مدیر، تنها راه بازیابی است.'); });
    });
  });
  document.getElementById('btn-logout').onclick = function(){ doLogout(); };
  document.getElementById('palette-btn').onclick = function(){ openPalettePicker(); };
  document.getElementById('topbar-user-btn').onclick = function(){ openProfileModal(); };
  document.getElementById('forgot-pass-link').onclick = function(){ openForgotPasswordModal(); };
  document.getElementById('sidebar-toggle').onclick = function(){ document.getElementById('sidebar').classList.toggle('collapsed'); };
  document.getElementById('theme-toggle').onclick = function(){ DB.settings.theme = DB.settings.theme==='dark'?'light':'dark'; applyTheme(); if(can('settings.manage')) saveDB(['settings']); };
  document.getElementById('notif-btn').onclick = function(e){ e.stopPropagation(); var panel=document.getElementById('notif-panel'); renderNotifPanel(); panel.classList.toggle('show'); };
  document.addEventListener('click', function(e){ var panel=document.getElementById('notif-panel'); if(panel.classList.contains('show') && !panel.contains(e.target) && e.target.id!=='notif-btn'){ panel.classList.remove('show'); } });
  document.getElementById('quick-search').addEventListener('keydown', function(e){
    if(e.key==='Enter'){ var v=e.target.value.trim(); if(v && can('search.use')){ navTo('#/search'); setTimeout(function(){ var inp=document.getElementById('gs-input'); if(inp){ inp.value=v; document.getElementById('gs-btn').click(); } },80); } }
  });
  showLogin();   // هر بار اجرای برنامه ورود لازم است؛ نشست روی دیسک ذخیره نمی‌شود
});

})();
