<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت مرکز آموزشی</title>
<style>
:root{
  --navy:#152341; --navy-2:#1c2d52; --navy-3:#24365f;
  --white:#ffffff; --bg:#f3f4f7; --gray:#e2e5ea; --gray-2:#cdd2db;
  --text:#1e2430; --text-mute:#6b7280; --text-soft:#8992a3;
  --success:#1f8a4c; --success-bg:#e8f6ee;
  --danger:#c0392b; --danger-bg:#fdeceb;
  --warning:#b06a12; --warning-bg:#fdf3e3;
  --info:#2457a6; --info-bg:#e9f0fb;
  --radius:8px; --shadow:0 1px 3px rgba(20,30,60,.08), 0 1px 2px rgba(20,30,60,.06);
  --sidebar-w:250px; --sidebar-w-c:70px; --topbar-h:58px;
}
[data-theme="dark"]{
  --navy:#0f1930; --navy-2:#16213e; --navy-3:#1c2a4d;
  --white:#1a2138; --bg:#101526; --gray:#293350; --gray-2:#37426a;
  --text:#e6e9f2; --text-mute:#a2acc4; --text-soft:#7c86a3;
  --success-bg:#123322; --danger-bg:#331615; --warning-bg:#332711; --info-bg:#122a4a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:"Segoe UI","Tahoma","Vazirmatn","B Nazanin",Tahoma,Arial,sans-serif;
  background:var(--bg); color:var(--text); direction:rtl; font-size:14px;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--gray-2);border-radius:10px;}
.hidden{display:none !important;}

/* ---------- LOGIN ---------- */
#login-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 55%,var(--navy-3) 100%);
  padding:20px;
}
.login-card{
  background:var(--white); width:100%; max-width:400px; border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.35); padding:38px 34px 30px; text-align:center;
}
.login-logo{width:64px;height:64px;margin:0 auto 14px;}
.login-card h1{font-size:20px;margin:0 0 4px;color:var(--navy);}
.login-card p.sub{color:var(--text-mute);font-size:13px;margin:0 0 26px;}
.field{text-align:right;margin-bottom:16px;}
.field label{display:block;font-size:12.5px;color:var(--text-mute);margin-bottom:6px;font-weight:600;}
.field .req{color:var(--danger);}
.field input,.field select,.field textarea{
  width:100%; padding:10px 12px; border:1px solid var(--gray-2); border-radius:8px;
  background:var(--bg); color:var(--text); transition:border .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy-3);}
.field textarea{resize:vertical;min-height:64px;}
.field.err input,.field.err select{border-color:var(--danger);}
.field .errmsg{color:var(--danger);font-size:11.5px;margin-top:4px;display:none;}
.field.err .errmsg{display:block;}
.checkline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-mute);margin-bottom:18px;justify-content:flex-start;}
.btn{
  border:none; border-radius:8px; padding:10px 18px; cursor:pointer; font-weight:600;
  font-size:13.5px; display:inline-flex; align-items:center; gap:6px; transition:filter .15s,transform .05s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{filter:brightness(1.15);}
.btn-block{width:100%;justify-content:center;padding:11px;}
.btn-outline{background:transparent;border:1px solid var(--gray-2);color:var(--text);}
.btn-outline:hover{background:var(--gray);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{filter:brightness(1.1);}
.btn-success{background:var(--success);color:#fff;}
.btn-ghost{background:transparent;color:var(--text-mute);padding:8px 10px;}
.btn-ghost:hover{background:var(--gray);color:var(--text);}
.btn-sm{padding:6px 10px;font-size:12px;}
.login-demo{background:var(--bg);border:1px dashed var(--gray-2);border-radius:8px;padding:10px;font-size:12px;color:var(--text-mute);margin-bottom:18px;}
.login-error{background:var(--danger-bg);color:var(--danger);border-radius:8px;padding:10px;font-size:12.5px;margin-bottom:14px;display:none;}

/* ---------- APP SHELL ---------- */
#app-screen{display:none;height:100vh;overflow:hidden;}
.app-shell{display:flex;height:100vh;}
.sidebar{
  width:var(--sidebar-w); background:var(--navy); color:#dbe2f2; display:flex; flex-direction:column;
  transition:width .18s ease; flex-shrink:0; height:100vh; overflow:hidden;
}
.sidebar.collapsed{width:var(--sidebar-w-c);}
.sidebar-head{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-head .logo-ic{width:30px;height:30px;flex-shrink:0;}
.sidebar-head .brand{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;}
.sidebar-head .brand small{display:block;font-size:10.5px;font-weight:400;color:#9fb0d6;}
.sidebar.collapsed .brand{display:none;}
.sidebar-toggle{margin-inline-start:auto;background:rgba(255,255,255,.06);border:none;color:#cdd7ef;width:26px;height:26px;border-radius:6px;cursor:pointer;flex-shrink:0;}
.sidebar-toggle:hover{background:rgba(255,255,255,.15);}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 10px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;margin-bottom:2px;
  color:#c4cee6;cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:#2b4478;color:#fff;font-weight:600;}
.sidebar.collapsed .nav-item span{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;}
.sidebar-foot{border-top:1px solid rgba(255,255,255,.08);padding:12px 14px;}
.sf-user{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.sf-avatar{width:32px;height:32px;border-radius:50%;background:#2b4478;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;color:#fff;}
.sf-user-info{overflow:hidden;white-space:nowrap;}
.sf-user-info .nm{font-size:12.5px;font-weight:600;color:#fff;}
.sf-user-info .rl{font-size:11px;color:#9fb0d6;}
.sidebar.collapsed .sf-user-info,.sidebar.collapsed .preview-wrap{display:none;}
.preview-wrap{margin-bottom:8px;}
.preview-wrap select{width:100%;font-size:11px;padding:5px;border-radius:6px;border:1px solid #37426a;background:#1c2a4d;color:#cdd7ef;}
.sf-logout{display:flex;align-items:center;gap:7px;width:100%;background:rgba(255,255,255,.06);border:none;color:#e3b7b0;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;}
.sf-logout:hover{background:rgba(255,255,255,.12);}
.sidebar.collapsed .sf-logout span{display:none;}
.sidebar.collapsed .sf-logout{justify-content:center;}

.main-wrap{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{
  height:var(--topbar-h);background:var(--white);border-bottom:1px solid var(--gray);
  display:flex;align-items:center;padding:0 18px;gap:14px;flex-shrink:0;
}
.topbar h2{font-size:16px;margin:0;font-weight:700;color:var(--navy);white-space:nowrap;}
[data-theme="dark"] .topbar h2{color:#dbe2f2;}
.topbar-search{
  flex:1;max-width:340px;display:flex;align-items:center;gap:8px;background:var(--bg);
  border:1px solid var(--gray);border-radius:8px;padding:7px 10px;
}
.topbar-search input{border:none;background:transparent;flex:1;outline:none;}
.topbar-search svg{width:15px;height:15px;color:var(--text-soft);flex-shrink:0;}
.topbar-search kbd{font-size:10px;background:var(--gray);padding:2px 5px;border-radius:4px;color:var(--text-mute);}
.topbar-right{margin-inline-start:auto;display:flex;align-items:center;gap:6px;}
.icon-btn{position:relative;width:36px;height:36px;border-radius:8px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-mute);}
.icon-btn:hover{background:var(--gray);}
.icon-btn svg{width:18px;height:18px;}
.badge-dot{position:absolute;top:5px;left:6px;background:var(--danger);color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.topbar-user{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 12px;border-radius:20px;cursor:pointer;}
.topbar-user:hover{background:var(--gray);}
.topbar-user .sf-avatar{width:28px;height:28px;font-size:11.5px;background:var(--navy);}
.topbar-user .nm{font-size:12.5px;font-weight:600;}
.topbar-user .rl{font-size:10.5px;color:var(--text-mute);}

.main-content{flex:1;overflow-y:auto;padding:20px 22px 40px;}

.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.page-head h1{font-size:19px;margin:0;color:var(--navy);}
[data-theme="dark"] .page-head h1{color:#dbe2f2;}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap;}
.breadcrumb{font-size:12px;color:var(--text-mute);margin-bottom:4px;}
.breadcrumb a{color:var(--info);cursor:pointer;}

.card{background:var(--white);border:1px solid var(--gray);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:18px;}
.section-title{font-size:14.5px;font-weight:700;margin:0 0 12px;color:var(--navy);}
[data-theme="dark"] .section-title{color:#dbe2f2;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px;}
.stat-card{background:var(--white);border:1px solid var(--gray);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;}
.stat-ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--info-bg);color:var(--info);}
.stat-ic svg{width:21px;height:21px;}
.stat-ic.c-green{background:var(--success-bg);color:var(--success);}
.stat-ic.c-red{background:var(--danger-bg);color:var(--danger);}
.stat-ic.c-orange{background:var(--warning-bg);color:var(--warning);}
.stat-ic.c-navy{background:var(--navy);color:#fff;}
.stat-val{font-size:19px;font-weight:800;color:var(--text);line-height:1.2;}
.stat-lbl{font-size:11.5px;color:var(--text-mute);}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media (max-width:1100px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.toolbar .grow{flex:1;min-width:180px;}
.input-s{padding:8px 10px;border:1px solid var(--gray-2);border-radius:7px;background:var(--white);width:100%;}
.input-s:focus{outline:none;border-color:var(--navy-3);}
select.input-s{cursor:pointer;}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{background:var(--bg);color:var(--text-mute);font-weight:700;text-align:right;padding:10px 12px;border-bottom:1px solid var(--gray);white-space:nowrap;font-size:12px;}
tbody td{padding:10px 12px;border-bottom:1px solid var(--gray);white-space:nowrap;}
tbody tr:hover{background:var(--bg);}
.table-wrap{overflow-x:auto;}
.row-actions{display:flex;gap:4px;}
.row-actions .icon-btn{width:30px;height:30px;}
.row-actions svg{width:15px;height:15px;}

.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-green{background:var(--success-bg);color:var(--success);}
.badge-red{background:var(--danger-bg);color:var(--danger);}
.badge-orange{background:var(--warning-bg);color:var(--warning);}
.badge-blue{background:var(--info-bg);color:var(--info);}
.badge-gray{background:var(--gray);color:var(--text-mute);}

.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12.5px;color:var(--text-mute);flex-wrap:wrap;gap:8px;}
.pagination .pg-btns{display:flex;gap:4px;}
.pg-btn{border:1px solid var(--gray-2);background:var(--white);border-radius:6px;width:28px;height:28px;cursor:pointer;color:var(--text);}
.pg-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.pg-btn:disabled{opacity:.4;cursor:not-allowed;}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-mute);}
.empty-state svg{width:54px;height:54px;color:var(--gray-2);margin-bottom:12px;}
.empty-state p{margin:0 0 14px;font-size:13.5px;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(10,15,30,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--white);border-radius:12px;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-box.modal-lg{max-width:900px;}
.modal-box.modal-sm{max-width:420px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--gray);}
.modal-head h3{margin:0;font-size:15.5px;color:var(--navy);}
[data-theme="dark"] .modal-head h3{color:#dbe2f2;}
.modal-body{padding:18px 20px;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--gray);display:flex;justify-content:flex-end;gap:8px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
.form-grid .full{grid-column:1/-1;}
@media (max-width:620px){.form-grid{grid-template-columns:1fr;}}

/* toast */
#toast-wrap{position:fixed;top:16px;left:16px;z-index:2000;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;min-width:220px;animation:toastin .18s ease;}
.toast.ok{background:var(--success);}
.toast.err{background:var(--danger);}
.toast.info{background:var(--info);}
@keyframes toastin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

.notif-panel{position:absolute;top:56px;left:16px;width:320px;background:var(--white);border:1px solid var(--gray);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.15);z-index:900;max-height:420px;overflow-y:auto;display:none;}
.notif-panel.show{display:block;}
.notif-item{padding:11px 14px;border-bottom:1px solid var(--gray);font-size:12.5px;}
.notif-item .t{color:var(--text-soft);font-size:11px;margin-top:3px;}
.notif-item.warn{border-right:3px solid var(--warning);}
.notif-item.danger{border-right:3px solid var(--danger);}
.notif-item.ok{border-right:3px solid var(--success);}

.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:18px;}
.detail-item{background:var(--bg);border-radius:8px;padding:10px 12px;}
.detail-item .lbl{font-size:11px;color:var(--text-mute);margin-bottom:3px;}
.detail-item .val{font-size:13.5px;font-weight:600;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--gray);margin-bottom:14px;overflow-x:auto;}
.tab-btn{padding:9px 14px;background:none;border:none;cursor:pointer;font-size:13px;color:var(--text-mute);border-bottom:2px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--navy);border-color:var(--navy);font-weight:700;}
[data-theme="dark"] .tab-btn.active{color:#dbe2f2;border-color:#dbe2f2;}

.confirm-icon{width:46px;height:46px;border-radius:50%;background:var(--danger-bg);color:var(--danger);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.confirm-icon svg{width:22px;height:22px;}

.toggle-switch{position:relative;display:inline-block;width:42px;height:23px;flex-shrink:0;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--gray-2);border-radius:24px;transition:.15s;}
.toggle-slider:before{content:"";position:absolute;height:17px;width:17px;right:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
.toggle-switch input:checked + .toggle-slider{background:var(--navy);}
.toggle-switch input:checked + .toggle-slider:before{transform:translateX(-19px);}

.receipt-box{border:1px solid var(--gray);border-radius:10px;padding:20px;max-width:420px;margin:0 auto;}
.receipt-box h3{text-align:center;color:var(--navy);margin:0 0 3px;}
.receipt-box .sub{text-align:center;color:var(--text-mute);font-size:12px;margin-bottom:16px;}
.receipt-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--gray);font-size:13px;}
.receipt-row b{font-weight:700;}
.receipt-amount{text-align:center;font-size:22px;font-weight:800;color:var(--navy);margin:14px 0;}

.quick-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.qa-btn{display:flex;align-items:center;gap:7px;background:var(--white);border:1px solid var(--gray);padding:9px 14px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--navy);}
[data-theme="dark"] .qa-btn{color:#dbe2f2;}
.qa-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
.qa-btn svg{width:15px;height:15px;}

.link-btn{color:var(--info);cursor:pointer;font-weight:600;background:none;border:none;padding:0;font-size:12.5px;}
.link-btn:hover{text-decoration:underline;}

.help-banner{background:var(--warning-bg);border:1px solid #e3c583;color:var(--warning);border-radius:8px;padding:10px 14px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;}

.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--gray);}
.settings-row:last-child{border-bottom:none;}
.settings-row .lbl{font-weight:600;font-size:13.5px;}
.settings-row .desc{font-size:11.5px;color:var(--text-mute);margin-top:2px;}

.mini-list{list-style:none;margin:0;padding:0;}
.mini-list li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--gray);font-size:12.5px;}
.mini-list li:last-child{border-bottom:none;}
.mini-list .m1{font-weight:600;}
.mini-list .m2{color:var(--text-mute);font-size:11.5px;}

.timetable-grid{display:grid;grid-template-columns:90px repeat(6,1fr);gap:1px;background:var(--gray);border:1px solid var(--gray);border-radius:8px;overflow:hidden;}
.tt-cell{background:var(--white);padding:8px;min-height:52px;font-size:11.5px;}
.tt-head{background:var(--navy);color:#fff;font-weight:700;text-align:center;padding:8px;font-size:12px;}
.tt-slot{cursor:pointer;}
.tt-slot:hover{background:var(--bg);}
.tt-slot.filled{background:var(--info-bg);}
.tt-slot .t1{font-weight:700;color:var(--navy);}
[data-theme="dark"] .tt-slot .t1{color:#dbe2f2;}
.tt-slot .t2{color:var(--text-mute);}

.att-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
.att-chip{border:1px solid var(--gray-2);border-radius:7px;padding:4px 10px;font-size:11.5px;cursor:pointer;background:var(--white);}
.att-chip.on-present{background:var(--success);color:#fff;border-color:var(--success);}
.att-chip.on-absent{background:var(--danger);color:#fff;border-color:var(--danger);}
.att-chip.on-leave{background:var(--warning);color:#fff;border-color:var(--warning);}
.att-chip.on-late{background:var(--info);color:#fff;border-color:var(--info);}



@media (max-width:980px){
  .sidebar{position:fixed;z-index:500;height:100vh;}
  .sidebar:not(.collapsed){box-shadow:6px 0 20px rgba(0,0,0,.2);}
  .main-wrap{width:100%;}
  .topbar-search{display:none;}
}
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="login-screen">
  <div class="login-card">
    <svg id="login-logo-svg" class="login-logo" viewBox="0 0 64 64" fill="none">
      <rect width="64" height="64" rx="14" fill="#152341"/>
      <path d="M12 24l20-10 20 10-20 10-20-10z" fill="#fff"/>
      <path d="M18 27v10c0 3 6 6 14 6s14-3 14-6V27" stroke="#fff" stroke-width="2.4" fill="none"/>
      <path d="M50 25v13" stroke="#fff" stroke-width="2.4"/>
    </svg>
    <img id="login-logo-img" class="login-logo" alt="" style="display:none;object-fit:contain;">

// لوگو: کوچک‌سازی به PNG (شفافیت حفظ می‌شود) و ذخیره به‌صورت data URL داخل تنظیمات
function resizeLogoFile(file,maxDim){
  return new Promise(function(resolve,reject){
    if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)){ reject(new Error('فرمت لوگو باید PNG یا JPG باشد.')); return; }
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){ URL.revokeObjectURL(url);
      var sc=Math.min(1,maxDim/Math.max(img.width,img.height)), w=Math.max(1,Math.round(img.width*sc)), h=Math.max(1,Math.round(img.height*sc));
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); resolve(cv.toDataURL('image/png')); };
    img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error('تصویر لوگو معتبر نیست.')); };
    img.src=url; });
}

async function loadDB(){

  if(raw && raw.__error) throw new Error(raw.__error);

  if(RESTRICTED) ACTIVE_BRANCH = raw.scope;
  else if(first && !ACTIVE_BRANCH){   // اولین ورود: اگر چند شعبه هست، شعبه‌ی پیش‌فرض؛ وگرنه همه

      var g = groupByYear(DB[k]||[]);
      var seen={};
      years.forEach(function(y){ ops.push({name:k, shard:y, records:g[y]||[], scopeBranch:sc}); seen[y]=1; });
      Object.keys(g).forEach(function(y){ if(!seen[y]) ops.push({name:k, shard:y, records:g[y], scopeBranch:sc}); });
    } else if(k==="settings"||k==="seq"){
      ops.push({name:k, object:DB[k]});
    } else {
      ops.push({name:k, shard:"", records:DB[k]||[], scopeBranch:sc});
    }
  });
  return ops;
}
var saveQueue = Promise.resolve();
function saveDB(names){
  if(!names || !names.length) return Promise.resolve(true);   // ذخیره‌ی «همه» حذف شد: مجموعه‌های غیرقابل‌خواندن نباید بازنویسی شوند
  names = names.concat(["seq"]).filter(function(n,i,a){ return a.indexOf(n)===i; });
  if(allMode()){   // در حالت «همه‌ی شعبه‌ها» رکورد جدید بدون شعبه‌ی مشخص ثبت نمی‌شود
    var orphan = names.some(function(n){ return n!=='notifications' && BRANCH_SCOPED.indexOf(n)>=0 && (DB[n]||[]).some(function(r){ return r && !r.branchId; }); });
    if(orphan){ toast('برای ثبت اطلاعات جدید ابتدا یک شعبه را از بالای صفحه انتخاب کنید.','err'); return loadDB().then(function(){ render(); return false; }); }
  }
  var ops = saveOps(names);
  saveQueue = saveQueue.then(function(){ return API.save(ops); }).then(function(res){
    if(res && res.__error){
      toast(res.__error,"err");
      if(res.code==='FORBIDDEN' || res.code==='BAD_REQUEST'){ return loadDB().then(function(){ render(); return false; }); }
      return false;
    }
    return true;
  }).catch(function(){ toast("خطا در ذخیره‌سازی اطلاعات!","err"); return false; });
  return saveQueue;
}

function toast(msg,type){
  type = type || "info";
  var wrap = document.getElementById('toast-wrap');
  var el = document.createElement('div');
  el.className = 'toast '+type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3200);
}
function openModal(html, opts){
  opts = opts||{};
  var root = document.getElementById('modal-root');
  var ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = '<div class="modal-box '+(opts.size==='lg'?'modal-lg':opts.size==='sm'?'modal-sm':'')+'">'+html+'</div>';
  root.appendChild(ov);
  requestAnimationFrame(function(){ ov.classList.add('show'); });
  ov.addEventListener('mousedown', function(e){ if(e.target===ov) closeModal(ov); });
  return ov.querySelector('.modal-box');
}
function closeModal(box){
  var ov = box.closest ? box.closest('.modal-overlay') : box.parentElement;
  if(!ov) ov = box;
  ov.classList.remove('show');
  setTimeout(function(){ ov.remove(); }, 120);
}

function fieldHTML(f, val){
  val = val===undefined||val===null ? "" : val;
  var reqStar = f.required ? '<span class="req">*</span>' : '';
  var wrapCls = f.full ? "field full" : "field";
  var html = '<div class="'+wrapCls+'" data-field="'+f.name+'">';
  html += '<label>'+f.label+' '+reqStar+'</label>';
  if(f.type==='photo'){
    html += '<div style="display:flex;align-items:center;gap:12px;"><div id="ph-prev" style="width:72px;height:72px;border-radius:50%;background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-mute);">بدون عکس</div><div><input type="file" id="ph-file" accept="image/*"><div style="margin-top:6px;"><button type="button" class="btn btn-outline btn-sm" id="ph-remove">حذف عکس</button></div></div></div>';
  } else if(f.type==='select'){
    html += '<select class="input-s" name="'+f.name+'" '+(f.disabled?'disabled':'')+'>';
    (f.options||[]).forEach(function(o){
      var ov = typeof o==='object'?o.value:o;
      var ol = typeof o==='object'?o.label:o;
      html += '<option value="'+esc(ov)+'" '+(String(val)===String(ov)?'selected':'')+'>'+esc(ol)+'</option>';
    });
    html += '</select>';
  } else if(f.type==='textarea'){
    html += '<textarea name="'+f.name+'" placeholder="'+(f.placeholder||'')+'">'+esc(val)+'</textarea>';
  } else if(f.type==='checkbox'){
    html += '<label class="toggle-switch"><input type="checkbox" name="'+f.name+'" '+(val?'checked':'')+'><span class="toggle-slider"></span></label>';
  } else {
    html += '<input type="'+(f.type||'text')+'" name="'+f.name+'" value="'+esc(val)+'" placeholder="'+(f.placeholder||'')+'" '+(f.disabled?'disabled':'')+' '+(f.step?'step="'+f.step+'"':'')+'>';
  }
  html += '<div class="errmsg"></div></div>';
  return html;
}
function readForm(container, fields){
  var data = {};
  fields.forEach(function(f){
    var el = container.querySelector('[name="'+f.name+'"]');
    if(!el) return;
    var v;
    if(f.type==='photo') return;
    if(f.type==='checkbox') v = el.checked;
    else { v = el.value; if(f.type==='number') v = v===""?null:Number(v); }
    data[f.name] = v;
  });
  return data;
}
function validateForm(container, fields, data, extraValidator){
  var ok = true;
  container.querySelectorAll('.field').forEach(function(el){ el.classList.remove('err'); var em=el.querySelector('.errmsg'); if(em) em.textContent=''; });
  fields.forEach(function(f){
    var wrap = container.querySelector('[data-field="'+f.name+'"]');
    if(!wrap) return;
    var v = data[f.name];
    if(f.required && (v===""||v===null||v===undefined)){
      wrap.classList.add('err'); wrap.querySelector('.errmsg').textContent = 'این فیلد نباید خالی باشد.'; ok=false;
    } else if(f.type==='number' && v!==null && v!==undefined && v<0){
      wrap.classList.add('err'); wrap.querySelector('.errmsg').textContent = 'مقدار نباید منفی باشد.'; ok=false;
    }
  });
  if(ok && extraValidator){
    var res = extraValidator(data);
    if(res && res.field){
      var wrap = container.querySelector('[data-field="'+res.field+'"]');
      if(wrap){ wrap.classList.add('err'); wrap.querySelector('.errmsg').textContent = res.msg; }
      ok = false;
    } else if(res && res.ok===false){ ok=false; toast(res.msg,'err'); }
  }
  return ok;
}

    '<button class="btn btn-primary" id="fm-save">ذخیره</button></div>';

function renderDataTable(container, opts){
  var state = opts.state || (opts.state = {q:"", filters:{}, sort:null, sortDir:1, page:1});
  function apply(){
    var rows = opts.data.slice();
    if(state.q){
      var q = state.q.toLowerCase();
      rows = rows.filter(function(r){
        return (opts.searchKeys||[]).some(function(k){
          var v = typeof k==='function'?k(r):r[k];
          return v!==undefined && v!==null && String(v).toLowerCase().indexOf(q)>-1;
        });
      });
    }
    (opts.filters||[]).forEach(function(f){
      var val = state.filters[f.key];
      if(val){ rows = rows.filter(function(r){ return String(f.getValue?f.getValue(r):r[f.key])===String(val); }); }
    });
    if(state.sort){
      rows.sort(function(a,b){ var av=a[state.sort], bv=b[state.sort]; if(av<bv) return -1*state.sortDir; if(av>bv) return 1*state.sortDir; return 0; });
    }
    return rows;
  }
  function draw(){
    var rows = apply();
    var pageSize = DB.settings.pageSize || 10;
    var totalPages = Math.max(1, Math.ceil(rows.length/pageSize));
    if(state.page>totalPages) state.page = totalPages;
    var pageRows = rows.slice((state.page-1)*pageSize, state.page*pageSize);
    var html = '<div class="toolbar">';
    html += '<div class="grow"><input class="input-s" id="dt-search" placeholder="جستجو..." value="'+esc(state.q)+'"></div>';
    (opts.filters||[]).forEach(function(f){
      html += '<select class="input-s" style="max-width:160px" data-filter="'+f.key+'"><option value="">'+f.label+' (همه)</option>';
      f.options.forEach(function(o){ var ov=typeof o==='object'?o.value:o, ol=typeof o==='object'?o.label:o; html += '<option value="'+esc(ov)+'" '+(state.filters[f.key]===ov?'selected':'')+'>'+esc(ol)+'</option>'; });
      html += '</select>';
    });
    if(opts.onPrint) html += '<button class="btn btn-outline btn-sm" id="dt-print"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg> چاپ</button>';
    html += '</div>';
    if(!pageRows.length){
      html += '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg><p>هیچ اطلاعاتی ثبت نشده است.</p>'+(opts.emptyAction||'')+'</div>';
    } else {
      html += '<div class="table-wrap"><table><thead><tr>';
      opts.columns.forEach(function(c){ html += '<th '+(c.sortable?'data-sort="'+c.key+'" style="cursor:pointer"':'')+'>'+c.label+(c.sortable&&state.sort===c.key?(state.sortDir>0?' ▲':' ▼'):'')+'</th>'; });
      if(opts.actions) html += '<th>عملیات</th>';
      html += '</tr></thead><tbody>';
      pageRows.forEach(function(r){
        html += '<tr>';
        opts.columns.forEach(function(c){ html += '<td>'+(c.render?c.render(r):esc(r[c.key])) +'</td>'; });
        if(opts.actions) html += '<td><div class="row-actions">'+opts.actions(r)+'</div></td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      html += '<div class="pagination"><div>'+rows.length+' نتیجه — صفحه '+state.page+' از '+totalPages+'</div><div class="pg-btns">'+
        '<button class="pg-btn" id="dt-prev" '+(state.page<=1?'disabled':'')+'>‹</button>'+
        '<button class="pg-btn" id="dt-next" '+(state.page>=totalPages?'disabled':'')+'>›</button></div></div>';
    }
    container.innerHTML = html;
    var s = container.querySelector('#dt-search'); if(s){ s.oninput = function(){ state.q = s.value; state.page=1; draw(); }; }
    container.querySelectorAll('[data-filter]').forEach(function(sel){ sel.onchange = function(){ state.filters[sel.getAttribute('data-filter')] = sel.value; state.page=1; draw(); }; });
    container.querySelectorAll('[data-sort]').forEach(function(th){ th.onclick = function(){ var k=th.getAttribute('data-sort'); if(state.sort===k){state.sortDir*=-1;}else{state.sort=k;state.sortDir=1;} draw(); }; });
    var prev = container.querySelector('#dt-prev'); if(prev) prev.onclick=function(){ state.page--; draw(); };
    var next = container.querySelector('#dt-next'); if(next) next.onclick=function(){ state.page++; draw(); };
    var pr = container.querySelector('#dt-print'); if(pr) pr.onclick = function(){ opts.onPrint(rows); };
    if(opts.afterDraw) opts.afterDraw(container, rows);
  }
  draw();
  return {refresh:draw, getState:function(){return state;}};
}

function readFileAsBase64(file){
  return new Promise(function(resolve,reject){
    var r = new FileReader();
    r.onload = function(){ resolve(String(r.result).split(',')[1]); };
    r.onerror = function(){ reject(r.error); };
    r.readAsDataURL(file);
  });
}
function resizeImageFile(file, maxDim){
  return new Promise(function(resolve, reject){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      URL.revokeObjectURL(url);
      var w = img.width, h = img.height;
      var scale = Math.min(1, maxDim / Math.max(w, h));
      var tw = Math.max(1, Math.round(w*scale)), th = Math.max(1, Math.round(h*scale));
      var canvas = document.createElement('canvas');
      canvas.width = tw; canvas.height = th;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, tw, th);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      resolve({base64: dataUrl.split(',')[1], mime:'image/jpeg', width:tw, height:th});
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('invalid image')); };
    img.src = url;
  });
}
function openFilePickerModal(title, accept, onPicked, imageMaxDim){

    (imageMaxDim?' تصاویر به‌صورت خودکار برای کوچک‌تر شدن حجم فشرده می‌شوند.':'')+'</div></div>'+
    '<div class="modal-foot"><button class="btn btn-outline" id="fp-cancel">لغو</button><button class="btn btn-primary" id="fp-ok">آپلود</button></div>';
  var box = openModal(html,{size:'sm'});
  box.querySelector('#fp-x').onclick=function(){closeModal(box);};
  box.querySelector('#fp-cancel').onclick=function(){closeModal(box);};

  };
  box.querySelector('#fp-ok').onclick=function(){

    if(!file){ toast('یک فایل انتخاب کنید.','err'); return; }

    var prep = (imageMaxDim && file.type.indexOf('image/')===0)
      ? resizeImageFile(file, imageMaxDim).then(function(r){ return {b64:r.base64, mime:r.mime}; })
      : readFileAsBase64(file).then(function(b64){ return {b64:b64, mime:file.type}; });

      var fid = 'F'+Date.now()+Math.floor(Math.random()*1000);

    }).then(function(info){
      closeModal(box); onPicked(info); toast('فایل با موفقیت ذخیره شد.','ok');
    }).catch(function(err){ toast('خطا در ذخیره فایل.','err'); console.error(err); });
  };
}

PAGES.years = function(main){

      ],

        confirmDelete('حذف سال تعلیمی','آیا از حذف «'+rec.title+'» مطمئن هستید؟', function(){
          DB.academicYears = DB.academicYears.filter(function(y){return y.id!==id;}); saveDB(['academicYears']);
          logAct('حذف','سال تعلیمی','سال «'+rec.title+'» حذف شد.'); toast('حذف شد.','ok'); draw();
        });
      }
    });
  }
  function openForm(rec){
    openFormModal({
      title: rec?'ویرایش سال تعلیمی':'سال تعلیمی جدید',
      fields:[
        {name:'title',label:'عنوان سال (مثلاً ۱۴۰۴-۱۴۰۵)',required:true,full:true},
        {name:'startDate',label:'تاریخ شروع',type:'date',required:true},
        {name:'endDate',label:'تاریخ پایان',type:'date',required:true},
        {name:'copyFrom',label:'کپی صنوف از سال دیگر',type:'select',options:selectOptions(DB.academicYears,'id',function(y){return y.title;},'— بدون کپی —')}
      ],
      data: rec||{}, showSaveNew:false,
      onSubmit:function(data){
        if(rec){ rec.title=data.title; rec.startDate=data.startDate; rec.endDate=data.endDate; saveDB(['academicYears']); logAct('ویرایش','سال تعلیمی','سال «'+rec.title+'» ویرایش شد.'); toast('ذخیره شد.','ok'); }
        else {
          var y = {id:genCode('year'), title:data.title, startDate:data.startDate, endDate:data.endDate, isCurrent:!DB.academicYears.length, closed:false};
          DB.academicYears.push(y);
          if(data.copyFrom){
            DB.classes.filter(function(c){return c.academicYearId===data.copyFrom;}).forEach(function(c){
              DB.classes.push({id:genCode('class'), name:c.name, section:c.section, capacity:c.capacity, headTeacherId:c.headTeacherId, room:c.room, courseId:c.courseId||'', levelId:c.levelId||'', academicYearId:y.id});
            });

        }
        draw();

  function openCloseYear(rec){
    var nextYears = DB.academicYears.filter(function(y){return y.id!==rec.id;});

      '<div class="modal-body"><p style="font-size:12.5px;color:var(--text-mute);">با بستن این سال، اطلاعات آن به‌طور کامل حفظ می‌شود و به‌عنوان آرشیف باقی می‌ماند. شاگردانی که «فعال» هستند می‌توانند به سال تعلیمی جدید و صنف بعدی منتقل شوند؛ این کار به سال تعلیمی نیاز دارد.</p>'+
      '<div class="field full"><label>انتقال شاگردان فعال به سال</label><select class="input-s" id="cy-target">'+
      '<option value="">— فقط بستن، بدون انتقال —</option>'+nextYears.map(function(y){return '<option value="'+y.id+'">'+esc(y.title)+'</option>';}).join('')+'</select></div></div>'+
      '<div class="modal-foot"><button class="btn btn-outline" id="cy-cancel">لغو</button><button class="btn btn-primary" id="cy-ok">بستن سال</button></div>';
    var box = openModal(html,{size:'sm'});
    box.querySelector('#cy-close').onclick=function(){closeModal(box);};
    box.querySelector('#cy-cancel').onclick=function(){closeModal(box);};
    box.querySelector('#cy-ok').onclick=function(){
      var target = box.querySelector('#cy-target').value;
      rec.closed = true; if(rec.isCurrent && target){ rec.isCurrent=false; }
      var moved=0;
      if(target){
        var tgt = byId(DB.academicYears, target);
        activeStudents().filter(function(s){return s.academicYearId===rec.id && s.status==='فعال';}).forEach(function(s){
          DB.enrollments.push({id:genCode('enroll'), yearId:rec.id, studentId:s.id, classId:s.classId, status:'ارتقا یافته'});
          s.academicYearId = target; moved++;
        });
        tgt.isCurrent = true;
      }
      saveDB(['academicYears','students','enrollments']);
      logAct('ویرایش','سال تعلیمی','سال «'+rec.title+'» بسته شد. '+moved+' شاگرد منتقل شدند.');
      toast('سال بسته شد و '+moved+' شاگرد منتقل شدند.','ok'); closeModal(box); draw(); render();
    };
  }
};

/* فرم صنف (مشترک بین صفحهٔ صنوف و صفحهٔ کورس‌ها): کورس ← سطح ← صنف */
function openClassForm(rec, preset, after){
  var yid = currentYearId(); preset = preset||{};
  var data = rec ? Object.assign({},rec) : {courseId:preset.courseId||'', levelId:preset.levelId||''};
  var courseOpts = selectOptions(DB.courses.filter(function(c){return c.status!=='ختم شده' || c.id===data.courseId;}),'id',function(c){return c.name;},'— بدون کورس (صنف عادی) —');
  function levelOpts(cid){ return selectOptions(DB.levels.filter(function(l){return l.courseId===cid;}).sort(function(a,b){return (Number(a.order)||0)-(Number(b.order)||0);}),'id',function(l){return l.name;},'— بدون سطح —'); }
  var box = openFormModal({
    title: rec?'ویرایش صنف':'صنف جدید',
    fields:[
      {name:'courseId',label:'کورس',type:'select',options:courseOpts},
      {name:'levelId',label:'سطح / دوره (Level)',type:'select',options:levelOpts(data.courseId)},
      {name:'name',label:'نام صنف',required:true,placeholder:'مثلاً Class A'},
      {name:'section',label:'شعبه',placeholder:'مثلاً الف'},
      {name:'capacity',label:'ظرفیت',type:'number'},
      {name:'room',label:'اتاق درسی'},
      {name:'headTeacherId',label:'استاد مسئول',type:'select',options:selectOptions(DB.teachers.filter(function(t){return t.status==='فعال';}),'id',function(t){return t.name;},'— انتخاب —')}
    ],
    data: data,
    onSubmit:function(d){
      d.courseId = d.courseId||''; d.levelId = d.courseId ? (d.levelId||'') : '';
      if(rec){ Object.assign(rec,d); saveDB(['classes']); logAct('ویرایش','صنوف','صنف «'+rec.name+'» ویرایش شد.'); toast('ذخیره شد.','ok'); }
      else { d.id=genCode('class'); d.academicYearId=yid; DB.classes.push(d); saveDB(['classes']); logAct('افزودن','صنوف','صنف جدید «'+d.name+'» ایجاد شد.'); toast('صنف ایجاد شد.','ok'); }
      if(after) after();
    }
  });
  var cSel = box.querySelector('[name="courseId"]'), lSel = box.querySelector('[name="levelId"]');
  if(cSel && lSel){ cSel.addEventListener('change', function(){ lSel.innerHTML = levelOpts(cSel.value).map(function(o){ return '<option value="'+esc(o.value)+'">'+esc(o.label)+'</option>'; }).join(''); }); }
  return box;
}

var GENDERS=["مذکر","اناث"];

/* ---------- انتقال بین شعبه‌ها ---------- */
function openTransferModal(type, rec, after){
  var cur = rec.branchId || '';
  var targets = DB.branches.filter(function(b){ return b.status==='فعال' && b.id!==cur; });
  if(!targets.length){ toast('شعبه‌ی فعال دیگری برای انتقال وجود ندارد.','err'); return; }
  var kind = type==='student'?'شاگرد':type==='teacher'?'استاد':'کارمند';
  var warn = type==='student' ? 'ثبت‌نام‌های فعال کورس پایان می‌یابد (به‌عنوان تاریخچه می‌ماند)، صنف شاگرد خالی می‌شود و باید در شعبه‌ی مقصد صنف جدید تعیین شود. حاضری، نمرات و پرداخت‌های قبلی در شعبه‌ی فعلی باقی می‌ماند.'
    : type==='teacher' ? 'پیوند این استاد با کورس‌ها، صنف‌ها و مضامین شعبه‌ی فعلی قطع می‌شود. سوابق معاش و حاضری در شعبه‌ی فعلی باقی می‌ماند.' : 'سوابق حاضری و معاش در شعبه‌ی فعلی باقی می‌ماند.';
  var box = openFormModal({
    title:'انتقال '+kind+' — '+rec.name, size:'sm',
    fields:[{name:'toBranchId',label:'شعبه‌ی مقصد',type:'select',required:true,options:selectOptions(targets,'id',function(b){return b.name;},'— انتخاب —')},{name:'note',label:'توضیح (اختیاری)',type:'textarea',full:true}],
    data:{},
    onSubmit:function(d){
      API.transferRun({type:type,id:rec.id,toBranchId:d.toBranchId,note:d.note||''}).then(function(r){
        if(r && r.__error){ toast(r.__error,'err'); return; }
        logAct('انتقال','شعبه‌ها',kind+' «'+rec.name+'» به شعبه‌ی «'+branchName(d.toBranchId)+'» منتقل شد.');
        toast(kind+' منتقل شد.','ok');
        return loadDB().then(function(){ if(after) after(); else render(); });
      });
    }
  });
  var note = document.createElement('div'); note.className='help-banner'; note.style.marginTop='8px'; note.textContent=warn;
  box.querySelector('.modal-body').appendChild(note);
}

    '<div style="background:'+accent+';color:#fff;padding:1.6mm 3mm;display:flex;align-items:center;gap:2mm;">'+(b.logo?'<img src="'+b.logo+'" style="height:8mm;max-width:14mm;object-fit:contain;background:#fff;border-radius:1mm;">':'')+
      '<div style="flex:1;"><div style="font-weight:bold;font-size:10pt;line-height:1.2;">'+esc(b.centerName)+'</div>'+(branchLine?'<div style="font-size:7pt;opacity:.9;">'+branchLine+'</div>':'')+'</div><div style="font-size:8pt;">کارت شاگردی</div></div>'+
    '<div style="display:flex;gap:3mm;padding:2.5mm 3mm;flex:1;">'+
      '<div style="width:22mm;height:28mm;border:1px solid #ccc;border-radius:1.5mm;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#f4f4f4;flex-shrink:0;">'+(photoB64?'<img src="data:image/jpeg;base64,'+photoB64+'" style="width:100%;height:100%;object-fit:cover;">':'<span style="font-size:7pt;color:#999;">عکس</span>')+'</div>'+
      '<div style="flex:1;line-height:1.55;"><div style="font-weight:bold;font-size:11pt;">'+esc(s.name)+'</div>'+
        '<div>شماره: <b>'+esc(s.id)+'</b></div>'+(s.fatherName?'<div>نام پدر: '+esc(s.fatherName)+'</div>':'')+
        (cls?'<div>صنف: '+esc(cls)+'</div>':'')+(courses.length?'<div>کورس‌ها: '+esc(courses.join('، '))+'</div>':'')+
        (s.phone?'<div>تماس: '+esc(s.phone)+'</div>':'')+(year?'<div>سال: '+esc(year.title)+'</div>':'')+'</div></div>'+
    '<div style="border-top:1px solid #ddd;padding:1mm 3mm;font-size:6.5pt;color:#555;text-align:center;">'+[b.address,b.phone].filter(Boolean).map(esc).join(' — ')+'</div></div>';
}
function printStudentCards(list){
  if(!list.length){ toast('شاگردی برای چاپ کارت وجود ندارد.','err'); return Promise.resolve(); }
  if(list.length>300){ toast('حداکثر ۳۰۰ کارت در هر چاپ؛ ابتدا فیلتر صنف را بگذارید.','err'); return Promise.resolve(); }
  return Promise.all(list.map(function(s){ return s.photoFileId ? API.fileGet(s.photoFileId).then(function(x){ return (x && !x.__error)?x:null; }).catch(function(){return null;}) : Promise.resolve(null); })).then(function(photos){
    var cards = list.map(function(s,i){ return studentCardHTML(s,photos[i]); }).join('');
    return printDoc('کارت شاگردی', '<div style="display:flex;flex-wrap:wrap;gap:5mm;justify-content:center;">'+cards+'</div>');
  });
}

      columns:[
        {key:'id',label:'شماره',sortable:true},{key:'name',label:'نام',sortable:true},
        {key:'fatherName',label:'نام پدر'},{key:'classId',label:'صنف',render:function(r){return classLabel(r.classId);}},
        {key:'courses',label:'کورس‌ها',render:function(r){ var n=activeCourseNames(r.id); return n.length?esc(n.join('، ')):'—'; }},{key:'phone',label:'تماس'},{key:'status',label:'وضعیت',render:function(r){return statusBadge(r.status);}}
      ],
      actions:function(r){ return iconBtn(SVG_VIEW,'مشاهده','view',r.id)+iconBtn(SVG_EDIT,'ویرایش','edit',r.id)+iconBtn(SVG_DELETE,'حذف','del',r.id); }
    });
    var tbl = main.querySelector('#s-table');
    bindOnce(tbl, 'click', function(e){
      var b=e.target.closest('[data-act]'); if(!b) return;
      var id=b.getAttribute('data-id'), act=b.getAttribute('data-act'), rec=byId(DB.students,id);
      if(act==='view') navTo('#/students/detail/'+id);
      else if(act==='edit') openForm(rec);
      else if(act==='del') confirmDelete('حذف شاگرد','آیا از حذف «'+rec.name+'» مطمئن هستید؟ این عملیات قابل بازگشت نیست مگر با بازیابی پشتیبان.', function(){
        rec.softDeleted = true; saveDB(['students']); logAct('حذف','شاگردان','شاگرد «'+rec.name+'» حذف شد.'); toast('حذف شد.','ok'); draw();
      });
    });
  }
  function studentFields(rec){
    return [
      {name:'photo',type:'photo',label:'عکس شاگرد',full:true},
      {name:'name',label:'نام کامل',required:true},{name:'fatherName',label:'نام پدر',required:true},
      {name:'grandfatherName',label:'نام پدرکلان'},{name:'birthDate',label:'تاریخ تولد',type:'date'},
      {name:'gender',label:'جنسیت',type:'select',options:GENDERS,required:true},{name:'phone',label:'شماره تماس'},
      {name:'classId',label:'صنف',type:'select',required:true,options:selectOptions(classOpts,'id',function(c){return classLabel(c.id);},'— انتخاب —')},
      {name:'parentId',label:'سرپرست',type:'select',options:selectOptions(DB.parents,'id',function(p){return p.name+' ('+(p.relation||'')+')';},'— انتخاب —')},
      {name:'emergencyName',label:'نام ولی / تماس اضطراری'},{name:'emergencyPhone',label:'شماره تماس اضطراری'},
      {name:'address',label:'آدرس',type:'textarea',full:true},
      {name:'status',label:'وضعیت',type:'select',options:STUDENT_STATUS,required:true},
      {name:'notes',label:'یادداشت‌ها',type:'textarea',full:true}
    ];
  }
  function openForm(rec){
    var photo={file:null,remove:false};
    var box = openFormModal({
      title: rec?'ویرایش شاگرد':'ثبت شاگرد جدید', showSaveNew: !rec, size:'lg',
      fields: studentFields(rec), data: rec||{status:'فعال',gender:'مذکر'},
      extraValidator:function(d){
        if(!d.name || d.name.trim().length<2) return {field:'name', msg:'نام معتبر وارد کنید.'};
        return true;
      },
      onSubmit:function(data){ preparePhoto().then(function(fid){ finishSave(data,fid); }).catch(function(){ toast('فایل عکس نامعتبر یا خراب است؛ عکس ذخیره نشد.','err'); finishSave(data,undefined); }); }
    });
    var prev = box.querySelector('#ph-prev');
    function showPrev(url){ prev.innerHTML = url ? '<img src="'+url+'" style="width:100%;height:100%;object-fit:cover;">' : 'بدون عکس'; }
    if(rec && rec.photoFileId){ API.fileGet(rec.photoFileId).then(function(b64){ if(b64 && !photo.file && !photo.remove) showPrev('data:image/jpeg;base64,'+b64); }); }
    box.querySelector('#ph-file').onchange=function(e){
      var f=e.target.files&&e.target.files[0]; if(!f) return;
      if(f.type.indexOf('image/')!==0){ toast('فقط فایل تصویری انتخاب کنید.','err'); e.target.value=''; return; }
      if(f.size>12*1024*1024){ toast('حجم عکس بیش از حد بزرگ است.','err'); e.target.value=''; return; }
      photo.file=f; photo.remove=false; showPrev(URL.createObjectURL(f));
    };
    box.querySelector('#ph-remove').onclick=function(){ photo.file=null; photo.remove=true; box.querySelector('#ph-file').value=''; showPrev(null); };
    function preparePhoto(){
      if(photo.file) return resizeImageFile(photo.file, 480).then(function(r){ var fid='F'+Date.now()+Math.floor(Math.random()*1000);
        return API.fileSave(fid, r.base64).then(function(res){ if(res && res.__error) throw new Error(res.__error); return fid; }); });
      return Promise.resolve(photo.remove ? null : undefined);   // undefined = بدون تغییر، null = حذف
    }
    function finishSave(data,fid){
      var oldFid = rec ? rec.photoFileId : null;
        if(rec){
          var oldParent = rec.parentId, oldClass = rec.classId;
          Object.assign(rec,data); if(fid!==undefined) rec.photoFileId=fid;
          syncParentLink(oldParent, rec.parentId, rec.id);
          saveDB(['students','parents']);
          logAct('ویرایش','شاگردان','شاگرد «'+rec.name+'» ویرایش شد.'+(oldClass!==rec.classId?' انتقال صنف از '+classLabel(oldClass)+' به '+classLabel(rec.classId)+'.':''));
          toast('ذخیره شد.','ok');
        } else {
          if(fid) data.photoFileId=fid; data.id=genCode('student'); data.academicYearId=yid; data.regDate=todayISO(); data.softDeleted=false;
          DB.students.push(data);
          syncParentLink(null, data.parentId, data.id);
          saveDB(['students','parents']);
          logAct('افزودن','شاگردان','شاگرد جدید «'+data.name+'» با شماره '+data.id+' ثبت شد.'); pushNotification('شاگرد جدید «'+data.name+'» ثبت شد.','ok');
          toast('شاگرد با شماره '+data.id+' ثبت شد.','ok');
        }
        if(rec && fid!==undefined && oldFid && oldFid!==fid) API.fileDelete(oldFid);
        photo.file=null; photo.remove=false;
        draw();
      }
    }
  function syncParentLink(oldPid, newPid, sid){
    if(oldPid && oldPid!==newPid){ var op=byId(DB.parents,oldPid); if(op) op.studentIds=(op.studentIds||[]).filter(function(x){return x!==sid;}); }
    if(newPid){ var np=byId(DB.parents,newPid); if(np){ np.studentIds=np.studentIds||[]; if(np.studentIds.indexOf(sid)<0) np.studentIds.push(sid); } }
  }
};

/* ---------- تقسیم اوقات ---------- */
var TT_DAYS=[{k:'SA',l:'شنبه'},{k:'SU',l:'یکشنبه'},{k:'MO',l:'دوشنبه'},{k:'TU',l:'سه‌شنبه'},{k:'WE',l:'چهارشنبه'},{k:'TH',l:'پنجشنبه'}];
var TT_HOURS=[1,2,3,4,5,6];
function ttConflict(yid, day, hour, teacherId, room, classId, excludeId){
  return DB.timetable.find(function(t){
    return t.yearId===yid && t.id!==excludeId && t.day===day && t.hour===hour &&
      (t.classId===classId || (teacherId && t.teacherId===teacherId) || (room && t.room===room));
  });
}
PAGES.timetable = function(main){
  var yid = currentYearId();
  var classes = DB.classes.filter(function(c){return c.academicYearId===yid;});
  if(!classes.length){ main.innerHTML='<div class="card card-pad">ابتدا یک صنف ایجاد کنید.</div>'; return; }
  var state = main.__ttState || (main.__ttState = {classId:classes[0].id});
  main.innerHTML = '<div class="page-head"><h1>تقسیم اوقات</h1><div class="actions"><select class="input-s" id="tt-class" style="max-width:220px;">'+
    classes.map(function(c){return '<option value="'+c.id+'" '+(c.id===state.classId?'selected':'')+'>'+esc(classLabel(c.id))+'</option>';}).join('')+
    '</select></div></div><div class="card card-pad"><div id="tt-grid"></div></div>';
  main.querySelector('#tt-class').onchange=function(e){ state.classId=e.target.value; draw(); };
  draw();
  function draw(){
    var grid = main.querySelector('#tt-grid');
    var html = '<div class="timetable-grid"><div class="tt-head">ساعت</div>'+TT_DAYS.map(function(d){return '<div class="tt-head">'+d.l+'</div>';}).join('');
    TT_HOURS.forEach(function(h){
      html += '<div class="tt-cell" style="text-align:center;font-weight:700;color:var(--text-mute);">'+h+'</div>';
      TT_DAYS.forEach(function(d){
        var slot = DB.timetable.find(function(t){return t.yearId===yid && t.classId===state.classId && t.day===d.k && t.hour===h;});
        html += '<div class="tt-cell tt-slot '+(slot?'filled':'')+'" data-day="'+d.k+'" data-hour="'+h+'">'+
          (slot? '<div class="t1">'+esc(subjectName(slot.subjectId))+'</div><div class="t2">'+esc(teacherName(slot.teacherId))+(slot.room?' • '+esc(slot.room):'')+'</div>' : '<span style="color:var(--text-soft);">+ افزودن</span>')+
          '</div>';
      });
    });
    html += '</div>';
    grid.innerHTML = html;
    grid.querySelectorAll('.tt-slot').forEach(function(cell){
      cell.onclick = function(){ openSlot(cell.getAttribute('data-day'), Number(cell.getAttribute('data-hour'))); };
    });
  }
  function openSlot(day,hour){
    var existing = DB.timetable.find(function(t){return t.yearId===yid && t.classId===state.classId && t.day===day && t.hour===hour;});
    var subjOpts = DB.subjects.filter(function(s){return (s.classIds||[]).indexOf(state.classId)>-1;});
    var html='<div class="modal-head"><h3>'+TT_DAYS.find(function(d){return d.k===day;}).l+' — ساعت '+hour+'</h3><button class="icon-btn" id="tt-x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>'+
      '<div class="modal-body"><div class="form-grid">'+
      fieldHTML({name:'subjectId',label:'مضمون',type:'select',required:true,options:selectOptions(subjOpts.length?subjOpts:DB.subjects,'id',function(s){return s.name;},'— انتخاب —')}, existing?existing.subjectId:'')+
      fieldHTML({name:'teacherId',label:'استاد',type:'select',options:selectOptions(DB.teachers,'id',function(t){return t.name;},'— انتخاب —')}, existing?existing.teacherId:'')+
      fieldHTML({name:'room',label:'اتاق'}, existing?existing.room:'')+
      '</div></div><div class="modal-foot">'+(existing?'<button class="btn btn-outline" id="tt-del">حذف این زمان</button>':'')+'<button class="btn btn-outline" id="tt-cancel">لغو</button><button class="btn btn-primary" id="tt-save">ذخیره</button></div>';
    var box = openModal(html,{size:'sm'});
    box.querySelector('#tt-x').onclick=function(){closeModal(box);};
    box.querySelector('#tt-cancel').onclick=function(){closeModal(box);};
    var delBtn = box.querySelector('#tt-del'); if(delBtn) delBtn.onclick=function(){ DB.timetable=DB.timetable.filter(function(t){return t.id!==existing.id;}); saveDB(['timetable']); toast('حذف شد.','ok'); closeModal(box); draw(); };
    box.querySelector('#tt-save').onclick=function(){
      var subjectId = box.querySelector('[name="subjectId"]').value;
      var teacherId = box.querySelector('[name="teacherId"]').value;
      var room = box.querySelector('[name="room"]').value;
      if(!subjectId){ toast('مضمون را انتخاب کنید.','err'); return; }
      var conflict = ttConflict(yid, day, hour, teacherId, room, state.classId, existing?existing.id:null);
      if(conflict){
        var reason = conflict.classId===state.classId ? 'این صنف' : (conflict.teacherId===teacherId ? 'این استاد' : 'این اتاق');
        toast('تضاد زمانی: '+reason+' در این ساعت قبلاً برنامه دارد.','err'); return;
      }
      if(existing){ existing.subjectId=subjectId; existing.teacherId=teacherId; existing.room=room; }
      else DB.timetable.push({id:genCode('tt'), yearId:yid, classId:state.classId, day:day, hour:hour, subjectId:subjectId, teacherId:teacherId, room:room});
      saveDB(['timetable']); logAct('ویرایش','تقسیم اوقات','برنامه صنف «'+classLabel(state.classId)+'» بروزرسانی شد.'); toast('ذخیره شد.','ok'); closeModal(box); draw();
    };
  }
};

/* ---------- حاضری ---------- */
var ATT_TYPES=[{k:'present',l:'حاضر'},{k:'absent',l:'غایب'},{k:'leave',l:'رخصت'},{k:'late',l:'تأخیر'}];
PAGES.attendance = function(main){
  var yid = currentYearId();
  var classes = DB.classes.filter(function(c){return c.academicYearId===yid;});
  if(!classes.length){ main.innerHTML='<div class="card card-pad">ابتدا یک صنف ایجاد کنید.</div>'; return; }
  var state = main.__attState || (main.__attState = {classId:classes[0].id, date:todayISO(), kind:'student'});
  main.innerHTML = '<div class="page-head"><h1>حاضری</h1><div class="actions">'+
    '<select class="input-s" id="at-kind" style="max-width:140px;"><option value="student" '+(state.kind==='student'?'selected':'')+'>شاگردان</option><option value="teacher" '+(state.kind==='teacher'?'selected':'')+'>استادان</option></select>'+
    (state.kind==='student'?('<select class="input-s" id="at-class" style="max-width:200px;">'+classes.map(function(c){return '<option value="'+c.id+'" '+(c.id===state.classId?'selected':'')+'>'+esc(classLabel(c.id))+'</option>';}).join('')+'</select>'):'')+
    '<input type="date" class="input-s" id="at-date" style="max-width:160px;" value="'+state.date+'">'+
    '<button class="btn btn-outline btn-sm" id="at-report">گزارش حاضری</button></div></div>'+
    '<div class="card card-pad"><div id="at-body"></div><div style="margin-top:14px;"><button class="btn btn-primary" id="at-save">ذخیره حاضری</button></div></div>';
  main.querySelector('#at-kind').onchange=function(e){ state.kind=e.target.value; PAGES.attendance(main); };
  var clsSel = main.querySelector('#at-class'); if(clsSel) clsSel.onchange=function(e){ state.classId=e.target.value; draw(); };
  main.querySelector('#at-date').onchange=function(e){ state.date=e.target.value; draw(); };
  main.querySelector('#at-report').onclick=function(){ navTo('#/reports'); };
  main.querySelector('#at-save').onclick=save;
  draw();
  function people(){ return state.kind==='student' ? studentsOfClass(state.classId,yid) : DB.teachers.filter(function(t){return t.status==='فعال';}); }
  function existingRec(){ return DB.attendance.find(function(a){return a.yearId===yid && a.kind===state.kind && a.date===state.date && (state.kind==='teacher'||a.classId===state.classId);}); }
  function draw(){
    var rec = existingRec();
    var body = main.querySelector('#at-body');
    var list = people();
    if(!list.length){ body.innerHTML='<div class="empty-state"><p>موردی برای ثبت حاضری وجود ندارد.</p></div>'; return; }
    body.innerHTML = '<div class="table-wrap"><table><thead><tr><th>نام</th><th>وضعیت</th></tr></thead><tbody>'+
      list.map(function(p){
        var cur = rec && rec.records ? rec.records[p.id] : 'present';
        cur = cur || 'present';
        return '<tr><td>'+esc(p.name)+'</td><td><div class="att-grid" data-person="'+p.id+'">'+ATT_TYPES.map(function(t){return '<div class="att-chip '+(cur===t.k?'on-'+t.k:'')+'" data-val="'+t.k+'">'+t.l+'</div>';}).join('')+'</div></td></tr>';
      }).join('')+'</tbody></table></div>';
    body.querySelectorAll('.att-grid').forEach(function(g){
      g.querySelectorAll('.att-chip').forEach(function(chip){
        chip.onclick=function(){ g.querySelectorAll('.att-chip').forEach(function(c){c.className='att-chip';}); chip.classList.add('on-'+chip.getAttribute('data-val')); };
      });
    });
  }
  function save(){
    var rec = existingRec();
    var records = {};
    main.querySelectorAll('.att-grid').forEach(function(g){
      var pid = g.getAttribute('data-person');
      var on = g.querySelector('.att-chip[class*="on-"]');
      records[pid] = on ? on.getAttribute('data-val') : 'present';
    });
    if(rec) rec.records = records;
    else DB.attendance.push({id:genCode('att'), yearId:yid, kind:state.kind, classId:state.kind==='student'?state.classId:null, date:state.date, records:records});

function classmateRank(student, exams){
  var mates = studentsOfClass(student.classId, student.academicYearId);
  if(mates.length<2) return null;
  var scored = mates.map(function(m){
    var sc=0, mx=0;
    exams.forEach(function(e){ var mk=DB.marks.find(function(x){return x.examId===e.id && x.studentId===m.id;}); if(mk){ sc+=mk.score; mx+=e.maxScore; } });
    return {id:m.id, pct: mx? sc/mx*100 : -1};
  }).filter(function(r){return r.pct>=0;});
  if(!scored.length) return null;
  scored.sort(function(a,b){return b.pct-a.pct;});
  var place = scored.findIndex(function(r){return r.id===student.id;}) + 1;
  if(place<=0) return null;
  return {place:place, total:scored.length};
}
/* صنف‌های یک شاگرد: صنف اصلی + صنف‌های ثبت‌نام کورس (برای کارنامه و گزارش پیشرفت) */
function studentClassIds(s){ var ids={}; if(s.classId) ids[s.classId]=1; DB.courseEnrollments.forEach(function(e){ if(e.studentId===s.id && e.classId) ids[e.classId]=1; }); return Object.keys(ids); }
function studentYearExams(s, classIds){ var ids=classIds||studentClassIds(s); return DB.exams.filter(function(e){ return e.yearId===s.academicYearId && ids.indexOf(e.classId)>=0; }); }
/* رتبه در کورس/سطح: بین همه‌ی شاگردانِ صنف‌های همان کورس (و سطح)، بر اساس فیصدی کل امتحان‌های همان صنف‌ها */
function courseRankOf(s){
  var cands = [s.classId].concat(DB.courseEnrollments.filter(function(e){return e.studentId===s.id && e.classId && e.status==='فعال';}).map(function(e){return e.classId;}));
  var cl=null; for(var i=0;i<cands.length && !cl;i++){ var c=byId(DB.classes,cands[i]); if(c && c.courseId) cl=c; }
  if(!cl) return null;
  var classes = DB.classes.filter(function(c){ return c.courseId===cl.courseId && (!cl.levelId || c.levelId===cl.levelId) && c.academicYearId===cl.academicYearId; }), ids = classes.map(function(c){return c.id;});
  var seen={}, group=[]; classes.forEach(function(c){ studentsOfClass(c.id,c.academicYearId).forEach(function(x){ if(!seen[x.id]){ seen[x.id]=1; group.push(x); } }); });
  if(group.length<2) return null;
  var pctOf=function(x){ var h=Assess.studentHistory(x.id, DB.exams.filter(function(e){return e.yearId===cl.academicYearId && ids.indexOf(e.classId)>=0;}), DB.marks); return h.length?Assess.overall(h).pct:NaN; };
  var rk = Assess.competitionRank(group, pctOf), me = rk.get(group.filter(function(x){return x.id===s.id;})[0]);
  return me ? {rank:me.rank,total:me.total,scope:cl.levelId?'سطح':'کورس'} : null;
}

  var result = sumMax===0?'—':(pct>=passPct()?'قبول':'ناکام');
  var rank = classmateRank(s, exams.filter(function(e){return e.classId===s.classId;}));

  var skills = Assess.skillAverages(history);
  var html = '<div class="modal-head"><h3>کارنامه شاگرد</h3><button class="icon-btn" id="rc-x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>'+

/* ---------- گزارش پیشرفت شاگرد: روند نمرات، مهارت‌ها، رتبه در هر امتحان ---------- */
function progressChartSVG(hist, passLine, color){
  var W=560,H=200,L=34,R=12,T=14,B=34, n=hist.length;
  var x=function(i){ return n===1 ? (L+(W-L-R)/2) : L+i*(W-L-R)/(n-1); }, y=function(p){ return T+(100-p)*(H-T-B)/100; };
  var g='';
  [0,25,50,75,100].forEach(function(v){ g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#ddd" stroke-width="1"/><text x="'+(L-4)+'" y="'+(y(v)+3)+'" font-size="9" text-anchor="end" fill="#666">'+v+'</text>'; });
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(passLine)+'" y2="'+y(passLine)+'" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/><text x="'+(W-R)+'" y="'+(y(passLine)-3)+'" font-size="9" text-anchor="end" fill="#dc2626">حد نصاب '+passLine+'٪</text>';
  var pts=hist.map(function(h,i){return x(i)+','+y(h.pct);}).join(' ');
  if(n>1) g+='<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2"/>';
  hist.forEach(function(h,i){ g+='<circle cx="'+x(i)+'" cy="'+y(h.pct)+'" r="3.5" fill="'+color+'"/><text x="'+x(i)+'" y="'+(y(h.pct)-7)+'" font-size="9" text-anchor="middle" fill="#222">'+h.pct+'</text><text x="'+x(i)+'" y="'+(H-B+13)+'" font-size="8.5" text-anchor="middle" fill="#555">'+esc(String(h.title).slice(0,14))+'</text>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:560px;direction:ltr;" role="img" aria-label="روند نمرات">'+g+'</svg>';
}

/* ثبت پرداخت (مشترک بین صفحهٔ فیس و پروفایل شاگرد) */
function openFeePaymentForm(studentId, invoiceId, after){

      {name:'studentId',label:'شاگرد',type:'select',required:true,options:selectOptions(activeStudents(),'id',function(s){return s.id+' - '+s.name;},'— انتخاب —')},

      {name:'amount',label:'مبلغ',type:'number',required:true},{name:'discount',label:'تخفیف (اختیاری)',type:'number'},
      {name:'date',label:'تاریخ پرداخت',type:'date',required:true},
      {name:'method',label:'روش پرداخت',type:'select',options:['نقدی','بانکی','موبایل بانکینگ']},
      {name:'note',label:'یادداشت',type:'textarea',full:true}
    ],

      return true;
    },
    onSubmit:function(data){
      if(data.discount){ var s=byId(DB.students,data.studentId); if(s){ s.feeDiscount=(s.feeDiscount||0)+Number(data.discount); } }
      data.invoiceId = data.invoiceId||'';
      data.id=genCode('payment'); data.yearId=(byId(DB.students,data.studentId)||{}).academicYearId||yid; data.receiptNo=data.id;
      DB.feePayments.push(data); saveDB(['feePayments','students']);
      logAct('ثبت پرداخت','فیس','پرداخت '+fmtMoney(data.amount)+' برای شاگرد «'+studentName(data.studentId)+'» ثبت شد.'+(data.invoiceId?' (فیس‌نامه '+data.invoiceId+')':''));
      toast('پرداخت ثبت شد.','ok'); if(after) after(); showReceiptModal(data);
    }
  });
  var ss=box.querySelector('[name="studentId"]'), is=box.querySelector('[name="invoiceId"]'), am=box.querySelector('[name="amount"]');
